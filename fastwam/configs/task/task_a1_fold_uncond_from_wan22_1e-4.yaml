# @package _global_
# Explicit fallback: Wan2.2 video expert + interpolated ActionDiT initialization.
# This is intentionally isolated from the unavailable FastWAM-v6 transfer run.
defaults:
  - override /data: task_a1_fold
  - override /model: fastwam
  - _self_

batch_size: 8
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  redirect_common_files: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 1000
max_steps: 25000
log_every: 10
save_every: 2500
state_keep_last: 2
eval_every: 1000
eval_sample_enabled: false
eval_fold_enabled: true
eval_fold_n_eps: 5
eval_fold_nfe: 10
eval_fold_max_win: 6

gradient_accumulation_steps: 1
mixed_precision: "bf16"
weight_decay: 1e-2
max_grad_norm: 1.0
seed: 42
resume: null
