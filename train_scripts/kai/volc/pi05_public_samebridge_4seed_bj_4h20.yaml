TaskName: "pi05-public-samebridge-4seed-v3-bj4g"
Description: "Public pi0.5 same-bridge evaluation, four simulator seeds and 50 episodes per task"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 21600
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  LAWAM=$REPO/lmvla/lawam
  export PUBLIC_PI05_REPO=$REPO
  export PUBLIC_PI05_MODEL=/vePFS-North-E/vis_robot/tim/hf_models/SidneyXie_pi05_robotwin
  export PALIGEMMA_TOKENIZER_PATH=/vePFS-North-E/vis_robot/tim/hf_models/paligemma_tokenizer
  export PUBLIC_PI05_SERVER_PY=/vePFS-North-E/vis_robot/tim/workspace/lerobot-pi05-server-venv/bin/python
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$LAWAM/robotwin_python_wrapper_northe.sh
  export PYTHONPATH="/vePFS-North-E/vis_robot/tim/workspace/lerobot-main/src:$REPO/kai0/packages/openpi-client/src:$REPO/kai0/src:${PYTHONPATH:-}"
  export TORCH_EXTENSIONS_DIR=/vePFS-North-E/vis_robot/tim/runtime/torch_extensions/h20_sm90_py310
  export TORCHINDUCTOR_CACHE_DIR=/vePFS-North-E/vis_robot/tim/runtime/torchinductor/pi05_h20_torch211
  export TORCH_CUDA_ARCH_LIST=9.0
  export SEEDS="0 1 2 3"
  export LOCAL_GPU_COUNT=4
  export ROBOTWIN_TEST_NUM=50
  export RESULT_NAME=pi05_public_samebridge_4seed_v3
  export RUN_TAG_PREFIX=public-samebridge-v3-bj
  mkdir -p "$TORCH_EXTENSIONS_DIR" "$TORCHINDUCTOR_CACHE_DIR"

  "$ROBOTWIN_PYTHON" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  bash "$REPO/train_scripts/kai/eval/run_pi05_public_samebridge_multiseed.sh"

  summary_count=$(find \
    "$LAWAM/results/eval_runs/robotwin/pi05_public_samebridge_4seed_v3" \
    -name summary.json -type f | wc -l)
  test "$summary_count" -ge 24

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
