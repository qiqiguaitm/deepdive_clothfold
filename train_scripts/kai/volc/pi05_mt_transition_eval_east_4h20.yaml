TaskName: "pi05-mt-transition-eval-east4g"
Description: "Frozen-scene pi0.5 milestone-transition evaluation"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/${RESULT_NAME:?missing RESULT_NAME}_${STAMP}_east.log" 2>&1
  set -x

  test -f "$REPO/logs/resource_markers/robotwin_renderer_east.ok"
  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"
  export TORCH_EXTENSIONS_DIR=/vePFS/tim/runtime/torch_extensions/h20_sm90_py310
  mkdir -p "$TORCH_EXTENSIONS_DIR"
  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"
  mkdir -p /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0

  export REPO
  export OPENPI_DATA_HOME=$REPO/openpi_cache
  export GPU_INDEX_OFFSET=0
  export PORT_BASE_OFFSET=${PORT_BASE_OFFSET:-18800}
  export TORCH_CUDA_ARCH_LIST=9.0
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.55
  exec bash "$REPO/train_scripts/kai/eval/run_pi05_mt_transition_formal.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
