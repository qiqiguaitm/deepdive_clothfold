TaskName: "pi05-a0-official-6task-cnsh-8a100"
Description: "PI0.5 A0 under the official RoboTwin evaluator, six-task panel, 100 episodes each"
Tags: []
ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.hpcpni2.28xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LAWAM=$REPO/lmvla/lawam
  RT=/vePFS/HuanQian/RoboTwin
  A0_CKPT=$REPO/kai0/checkpoints/pi05_robotwin_a0_official_bj/pi05_robotwin_a0_official/19999
  A0_CFG=$REPO/train_scripts/kai/eval/pi05_robotwin_a0_official_deploy.yml
  RT_PY=$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh
  OPENPI_PY=$REPO/kai0/.venv/bin/python
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$LAWAM/logs/pi05_a0_official_6task
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/orchestrator_${STAMP}.log" 2>&1
  set -x

  test -d "$A0_CKPT/params"
  test -x "$RT_PY"
  test -x "$OPENPI_PY"
  "$RT_PY" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'

  run_task() {
    local task=$1
    local gpu=$2
    local port=$3
    local server_log=$LOG_DIR/${task}_server_${STAMP}.log
    local eval_log=$LOG_DIR/${task}_eval_${STAMP}.log
    local result_marker=$LOG_DIR/${task}_result_marker_${STAMP}
    touch "$result_marker"

    CUDA_VISIBLE_DEVICES=$gpu \
    XLA_PYTHON_CLIENT_MEM_FRACTION=0.35 \
    XLA_PYTHON_CLIENT_PREALLOCATE=false \
      "$OPENPI_PY" "$REPO/kai0/scripts/serve_policy.py" \
        --port "$port" \
        policy:checkpoint \
        --policy.config pi05_robotwin_a0_official_bj \
        --policy.dir "$A0_CKPT" \
        > "$server_log" 2>&1 &
    local server_pid=$!

    local ready=0
    for _ in $(seq 1 180); do
      if curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null; then
        ready=1
        break
      fi
      if ! kill -0 "$server_pid" 2>/dev/null; then
        cat "$server_log"
        return 1
      fi
      sleep 2
    done
    if [[ "$ready" != 1 ]]; then
      kill "$server_pid" 2>/dev/null || true
      return 1
    fi

    local status=0
    (
      cd "$RT"
      CUDA_VISIBLE_DEVICES=$gpu \
      OPENPI_WS_PORT=$port \
      ROBOTWIN_REPLAN_STEPS=50 \
      PYTHONPATH="$REPO/kai0/packages/openpi-client/src:$LAWAM/examples/Robotwin/eval_files:/vePFS/tim/workspace/robotwin-ws-deps:$RT:${PYTHONPATH:-}" \
        "$RT_PY" script/eval_policy.py \
          --config "$A0_CFG" \
          --overrides \
          --task_name "$task" \
          --task_config demo_clean \
          --train_config_name pi05_robotwin_a0_official_bj \
          --model_name kai0_a0_official_ws \
          --ckpt_setting a0-official-native-6task \
          --seed 0 \
          --policy_name official_openpi_ws_policy
    ) > "$eval_log" 2>&1 || status=$?

    if ! find "$RT/eval_result/$task/official_openpi_ws_policy/demo_clean/a0-official-native-6task" \
        -type f -name _result.txt -newer "$result_marker" -print -quit 2>/dev/null | grep -q .; then
      echo "Official evaluator exited without producing a result file" >> "$eval_log"
      status=1
    fi
    kill "$server_pid" 2>/dev/null || true
    wait "$server_pid" 2>/dev/null || true
    return "$status"
  }

  tasks=(
    beat_block_hammer
    blocks_ranking_size
    blocks_ranking_rgb
    handover_block
    stack_blocks_two
    stack_blocks_three
  )

  pids=()
  for i in "${!tasks[@]}"; do
    run_task "${tasks[$i]}" "$i" "$((11200 + i * 100))" &
    pids+=("$!")
  done

  status=0
  for pid in "${pids[@]}"; do
    wait "$pid" || status=1
  done
  exit "$status"
