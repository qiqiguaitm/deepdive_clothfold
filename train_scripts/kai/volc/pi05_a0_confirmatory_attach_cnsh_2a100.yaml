TaskName: "pi05-a0-confirmatory-attach3-cnsh2g"
Description: "Attach two A100 workers to the remaining A0 frozen-scene cells"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.7xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: ATTACH_SEEDS
    Value: "2 3"
  - Name: WORKER_INDEX_BASE
    Value: "4000"
  - Name: ATTACH_GROUP_NAME
    Value: "platform3"

Entrypoint: |
  set -euo pipefail
  exec bash /vePFS/tim/workspace/deepdive_kai0/train_scripts/kai/eval/attach_pi05_a0_confirmatory_platform.sh

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
