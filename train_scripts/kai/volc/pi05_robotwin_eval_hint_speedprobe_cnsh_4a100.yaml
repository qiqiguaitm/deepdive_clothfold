TaskName: "pi05-a2-slots-speedprobe-cnsh4g"
Description: "pi05 A2 RoboTwin server-side So400m slots speed probe, four A100"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.14xlarge"

ActiveDeadlineSeconds: 21600
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OPENPI_DATA_HOME
    Value: "/vePFS/tim/workspace/openpi_cache"
  - Name: ROBOTWIN_EVAL_CONFIG
    Value: "pi05_robotwin_a2_prefix_official_eval_bj"
  - Name: ROBOTWIN_EVAL_CKPT_ROOT
    Value: "/vePFS/tim/workspace/deepdive_kai0/kai0/checkpoints/pi05_robotwin_a2_prefix_official_bj/pi05_robotwin_a2_prefix_official"
  - Name: ROBOTWIN_EVAL_RESULT_NAME
    Value: "pi05_a2_slots_speedprobe_cnsh"
  - Name: ROBOTWIN_HINT_ENCODER
    Value: "so400m"
  - Name: OPENPI_SERVER_HINT_ENCODER
    Value: "so400m"
  - Name: EVAL_HINT_RESIDUAL
    Value: "0"
  - Name: ROBOTWIN_EVAL_PORT_BASE
    Value: "9700"
  - Name: ROBOTWIN_EVAL_NUM_SEEDS
    Value: "4"

Entrypoint: |
  set -euo pipefail
  export REPO=/vePFS/tim/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/${ROBOTWIN_EVAL_RESULT_NAME}_${STAMP}.log" 2>&1
  set -x

  apt-get update -qq
  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libvulkan1 libegl1
  ldconfig
  export XDG_RUNTIME_DIR=/tmp/runtime-root
  mkdir -p "$XDG_RUNTIME_DIR"
  chmod 700 "$XDG_RUNTIME_DIR"

  mkdir -p /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  cd "$REPO/lmvla/lawam"

  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG=$ROBOTWIN_EVAL_CONFIG
  export OPENPI_SERVE_SCRIPT=$REPO/kai0/scripts/serve_policy.py
  export KAI0_ROOT=$REPO/kai0
  export ROBOTWIN_MODEL_INTERFACE=openpi

  CKPT=$(find "$ROBOTWIN_EVAL_CKPT_ROOT" -maxdepth 1 -type d -regex '.*/[0-9]+' | sort -V | tail -1)
  [ -n "$CKPT" ] || { echo "FATAL: no checkpoint under $ROBOTWIN_EVAL_CKPT_ROOT" >&2; exit 13; }
  [ -d "$CKPT/params" ] || { echo "FATAL: checkpoint missing params/: $CKPT" >&2; exit 13; }
  [ -f "$CKPT/assets/robotwin2.0/norm_stats.json" ] || {
    echo "FATAL: checkpoint missing norm stats: $CKPT" >&2
    exit 13
  }

  export ROBOTWIN_PATH=/vePFS/HuanQian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh
  "$ROBOTWIN_PYTHON" -c 'import sapien.core as sapien; import mplib; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  "$ROBOTWIN_PYTHON" -c "from transformers import AutoProcessor; AutoProcessor.from_pretrained('$REPO/lmvla/lmwm/data/hf_so400m')"
  export PYTHONPATH="$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  "$ROBOTWIN_PYTHON" -c 'import openpi_client.websocket_client_policy' 2>/dev/null ||
    "$ROBOTWIN_PYTHON" -m pip install -q websockets msgpack

  export ROBOTWIN_TASKS="${ROBOTWIN_TASKS:-beat_block_hammer}"
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM="${ROBOTWIN_TEST_NUM:-10}"
  export ROBOTWIN_NUM_SLOTS="${ROBOTWIN_NUM_SLOTS:-1}"
  export NUM_WORKERS=1
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_INSTRUCTION_TYPE=unseen
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=50
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST=8.0
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.55

  pids=""
  for i in $(seq 0 $((ROBOTWIN_EVAL_NUM_SEEDS - 1))); do
    (
      export CUDA_VISIBLE_DEVICES=$i
      export GPU_IDS=$i
      export SEED=$i
      export PORT_BASE=$((ROBOTWIN_EVAL_PORT_BASE + i*40))
      export ROBOTWIN_EVAL_ROOT=$REPO/lmvla/lawam/results/eval_runs/robotwin/$ROBOTWIN_EVAL_RESULT_NAME/seed$i
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh \
        "$CKPT" "$TASK_CONFIG" "unseen-hint-seed$i"
    ) > "$LOG_DIR/${ROBOTWIN_EVAL_RESULT_NAME}_${STAMP}_seed${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 20
  done
  status=0
  for pid in $pids; do wait "$pid" || status=1; done
  echo "=== $ROBOTWIN_EVAL_RESULT_NAME DONE status=$status $(date -u) ==="
  exit "$status"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
