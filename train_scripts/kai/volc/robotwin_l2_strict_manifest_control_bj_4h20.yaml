TaskName: "robotwin-l2-strict-manifest-control-bj4g"
Description: "Strict fixed-scene L2 control, six tasks x four eval seeds"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: L2_STRICT_METHOD
    Value: "residual"
  - Name: L2_STRICT_CONTROL
    Value: "zero"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  mkdir -p "$LOG_DIR" /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  exec >> "$LOG_DIR/l2_strict_${L2_STRICT_METHOD}_${L2_STRICT_CONTROL}_${STAMP}.log" 2>&1
  set -x

  export REPO_ROOT=$REPO
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  export TORCH_CUDA_ARCH_LIST=9.0
  "$ROBOTWIN_PYTHON" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  nvidia-smi -L
  env SEEDS="0 1 2 3" GPUS_PER_SEED=1 LOCAL_GPU_COUNT=4 GPU_INDEX_OFFSET=0 \
    NUM_WORKERS=1 ROBOTWIN_NUM_SLOTS=1 \
    bash "$REPO/train_scripts/kai/eval/local_robotwin_l2_strict_manifest_control.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
