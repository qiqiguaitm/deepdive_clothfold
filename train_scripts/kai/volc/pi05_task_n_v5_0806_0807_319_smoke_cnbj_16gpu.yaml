TaskName: "pi05-task-n-v5-0806-0807-319-smoke-cnbj-16h20"
Description: "Task_N 319 frozen-data two-host resume smoke: 0-25 then 25-50, inline val and checkpoint gate"
Tags: []
Preemptible: false
ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 2
    Flavor: "ml.hpcpni3ln.45xlarge"
ActiveDeadlineSeconds: 14400
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"
CacheType: "Cloudfs"
Envs:
  - {Name: PYTHONUNBUFFERED, Value: "1"}
  - {Name: HF_HUB_OFFLINE, Value: "1"}
  - {Name: TRANSFORMERS_OFFLINE, Value: "1"}
  - {Name: TOKENIZERS_PARALLELISM, Value: "false"}
  - {Name: NCCL_DEBUG, Value: "WARN"}
  - {Name: OMP_NUM_THREADS, Value: "8"}
  - {Name: XLA_PYTHON_CLIENT_MEM_FRACTION, Value: "0.85"}
  - {Name: JAX_COMPILATION_CACHE_MIN_ENTRY_SIZE_BYTES, Value: "-1"}
  - {Name: JAX_COMPILATION_CACHE_MIN_COMPILE_TIME_SECS, Value: "1"}
  - {Name: JAX_ENABLE_EMPTY_ARRAYS, Value: "true"}
Entrypoint: |
  set -euo pipefail
  ROOT=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  CODE_ROOT=$ROOT/.staging/task_n_319_code
  KAI0=$ROOT/kai0
  TRAIN=$KAI0/data/Task_N/self_built/nail_v5_0806_0807_319_joint14_train
  VAL=$KAI0/data/Task_N/self_built/nail_v5_0806_0807_319_joint14_val
  INIT=/vePFS-North-E/vis_robot/base_init_ckpts/extracted/pi05_base/params
  BASE=$KAI0/checkpoints/task_n_v5_0806_0807_319_smoke
  EXP=nail_v5_0806_0807_319_smoke_bs128_s42
  NODE=${MLP_ROLE_INDEX:-0}
  LOG=$ROOT/logs/pi05_task_n_v5_0806_0807_319_smoke_$(date -u +%Y%m%d_%H%M%S)_node${NODE}.log
  mkdir -p "$ROOT/logs" "$BASE"
  exec > >(tee -a "$LOG") 2>&1

  test -f "$CODE_ROOT/TASK_N_319_CODE_COMMIT"
  test "$(git -C "$CODE_ROOT" rev-parse HEAD)" = "$(cat "$CODE_ROOT/TASK_N_319_CODE_COMMIT")"
  test "$(find "$TRAIN/data" -name '*.parquet' | wc -l)" -eq 287
  test "$(find "$VAL/data" -name '*.parquet' | wc -l)" -eq 32
  test "$(find "$TRAIN/videos" -name '*.mp4' | wc -l)" -eq 861
  test "$(find "$VAL/videos" -name '*.mp4' | wc -l)" -eq 96
  test -f "$TRAIN/norm_stats.json"
  test -f "$TRAIN/NORTH_SYNC_OK.json"
  test -f "$INIT/_METADATA"
  test "$(nvidia-smi -L | wc -l)" -eq 8

  export PYTHONPATH="$CODE_ROOT/kai0/src${PYTHONPATH:+:$PYTHONPATH}"
  export TASK_N_319_KAI0_ROOT="$KAI0"
  export TASK_N_319_INIT="$INIT"
  PYTHON=$KAI0/.venv/bin/python
  "$PYTHON" - <<'PY'
  from openpi.training.config import get_config
  c = get_config("pi05_task_n_v5_0806_0807_319_sft")
  assert (c.fsdp_devices, c.batch_size, c.num_workers) == (16, 128, 24), c
  assert c.num_train_steps == 40_000 and c.save_interval == 2_000
  print("CONFIG_OK", c.name)
  PY

  export JAX_NUM_PROCESSES="${MLP_WORKER_NUM:-2}"
  export JAX_PROCESS_INDEX="$NODE"
  export JAX_COORDINATOR_ADDRESS="${MLP_WORKER_0_HOST}:15830"
  "$PYTHON" -u "$CODE_ROOT/kai0/scripts/train.py" pi05_task_n_v5_0806_0807_319_sft \
    --exp-name "$EXP" --checkpoint-base-dir "$BASE" --num-train-steps 25 \
    --save-interval 25 --keep-period 25 --no-wandb-enabled --overwrite

  sleep 10
  export JAX_COORDINATOR_ADDRESS="${MLP_WORKER_0_HOST}:15831"
  "$PYTHON" -u "$CODE_ROOT/kai0/scripts/train.py" pi05_task_n_v5_0806_0807_319_sft \
    --exp-name "$EXP" --checkpoint-base-dir "$BASE" --num-train-steps 50 \
    --save-interval 25 --keep-period 25 --no-wandb-enabled --resume

  test -d "$BASE/pi05_task_n_v5_0806_0807_319_sft/$EXP/49"
  if [ "$NODE" = 0 ]; then
    printf 'SMOKE_OK commit=%s completed_at=%s\n' \
      "$(cat "$CODE_ROOT/TASK_N_319_CODE_COMMIT")" "$(date -u +%FT%TZ)" > "$ROOT/logs/task_n_v5_0806_0807_319_smoke.ok"
  fi
RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
