TaskName: "pi05-mt3-learned-s1000-east4g"
Description: "Gate-controlled selected pi0.5 MT3 policy pilot"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 345600
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  test -f "$REPO/logs/resource_markers/pi05_mt3_tracker_selected.ok"
  if [[ -n "${PILOT_GATE:-}" ]]; then test -f "$PILOT_GATE"; fi
  SELECTION=$REPO/logs/mt_stage_tracker/selection.json
  candidate=$($REPO/kai0/.venv/bin/python -c "import json; print(json.load(open('$SELECTION'))['selected'])")
  tracker=$REPO/logs/mt_stage_tracker/$candidate/tracker.pt
  test -f "$tracker"
  export PI05_EXACT_DATASET=/vePFS/tim/workspace/VLANeXt-main/datasets/robotwin2.0_official_prompts_v21
  export PI05_BASE_PARAMS=$REPO/kai0/checkpoints/pi05_base/params
  export OPENPI_DATA_HOME=$REPO/openpi_cache
  export JAX_COMPILATION_CACHE_DIR=$REPO/.cache/jax-mt-transition
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.92
  mkdir -p "$JAX_COMPILATION_CACHE_DIR"
  exec env ARM=mt3_learned STEPS=50000 WORKERS=8 SAVE_INTERVAL=5000 \
    TRACKER_CANDIDATE="$candidate" TRACKER_CHECKPOINT="$tracker" \
    bash "$REPO/train_scripts/kai/run_pi05_mt_transition_train.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
