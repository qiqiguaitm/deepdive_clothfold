TaskName: "pi05-confirmatory-eval-east4g"
Description: "Matched pi0.5 A0/A2/A3 confirmation on frozen six-task RoboTwin scenes"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LAWAM=$REPO/lmvla/lawam
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$LAWAM/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/${ROBOTWIN_EVAL_RESULT_NAME}_${STAMP}.log" 2>&1
  set -x

  test -f "$REPO/logs/resource_markers/robotwin_renderer_east.ok"
  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"
  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"
  mkdir -p /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0

  PY=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PY
  export OPENPI_DATA_HOME=$REPO/openpi_cache
  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG="${ROBOTWIN_EVAL_CONFIG:-${PI05_EVAL_CONFIG_NAME:?missing evaluator config}}"
  export OPENPI_SERVE_SCRIPT=$REPO/kai0/scripts/serve_policy.py
  export KAI0_ROOT=$REPO/kai0
  export ROBOTWIN_MODEL_INTERFACE=openpi

  CKPT=$(find "$ROBOTWIN_EVAL_CKPT_ROOT" -maxdepth 1 -type d -regex '.*/[0-9]+' | sort -V | tail -1)
  test -n "$CKPT"
  test -d "$CKPT/params"
  ASSET_ID="${PI05_ASSET_ID:-robotwin2.0}"
  test -f "$CKPT/assets/$ASSET_ID/norm_stats.json"

  export ROBOTWIN_PATH=/vePFS/HuanQian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh
  "$ROBOTWIN_PYTHON" -c \
    'import sapien.core as sapien; import mplib; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  if [ "${ROBOTWIN_HINT_ENCODER:-none}" = "so400m" ]; then
    "$ROBOTWIN_PYTHON" -c \
      "from transformers import AutoModel, AutoProcessor; AutoProcessor.from_pretrained('$REPO/lmvla/lmwm/data/hf_so400m')"
  fi
  export PYTHONPATH="$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  "$ROBOTWIN_PYTHON" -c 'import openpi_client.websocket_client_policy' 2>/dev/null ||
    "$ROBOTWIN_PYTHON" -m pip install -q websockets msgpack

  export ROBOTWIN_TASKS="${ROBOTWIN_TASKS:-beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three}"
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM="${ROBOTWIN_TEST_NUM:-50}"
  export ROBOTWIN_NUM_SLOTS="${ROBOTWIN_NUM_SLOTS:-1}"
  export NUM_WORKERS=1
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_INSTRUCTION_TYPE=unseen
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=50
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST=9.0
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.55

  cd "$LAWAM"
  pids=""
  status=0
  for seed in 0 1 2 3; do
    (
      export CUDA_VISIBLE_DEVICES=$seed
      export GPU_IDS=$seed
      export SEED=$seed
      export PORT_BASE=$((10600 + seed * 40))
      export ROBOTWIN_EVAL_ROOT=$LAWAM/results/eval_runs/robotwin/$ROBOTWIN_EVAL_RESULT_NAME/seed$seed
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh \
        "$CKPT" "$TASK_CONFIG" "confirmatory-seed$seed"
    ) > "$LOG_DIR/${ROBOTWIN_EVAL_RESULT_NAME}_${STAMP}_seed${seed}.log" 2>&1 &
    pids="$pids $!"
    sleep 20
  done
  for pid in $pids; do wait "$pid" || status=1; done
  count=$(find "$LAWAM/results/eval_runs/robotwin/$ROBOTWIN_EVAL_RESULT_NAME" -name summary.json | wc -l)
  test "$count" -eq 24 || status=1
  echo "confirmatory evaluation done status=$status summaries=$count"
  exit "$status"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
