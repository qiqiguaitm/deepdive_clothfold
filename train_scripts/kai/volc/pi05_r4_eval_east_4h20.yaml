TaskName: "pi05-r4-eval-east4g"
Description: "Fixed-manifest closed-loop evaluation of one R4 seed-1000 arm"
Tags: []
ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"
ActiveDeadlineSeconds: 43200
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
Entrypoint: |
  export REPO=/vePFS/tim/workspace/deepdive_kai0
  : "${R4_ARM:?R4_ARM must be supplied by the scheduler}"
  export LOCAL_GPU_COUNT=4 GPU_INDEX_OFFSET=0
  exec bash "$REPO/train_scripts/kai/eval/run_pi05_r4_formal_eval.sh"
RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
