TaskName: "temporal-grounding-tg1b-retry500-north4g"
Description: "Frozen TG1B retry500 panel from verified North staging"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: TG1B_CHECKPOINT_ARM
    Value: "future_off"
  - Name: TG1B_EXECUTION_CADENCE
    Value: "36"

Entrypoint: |
  set -euo pipefail
  ROOT=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  REPO=$ROOT/.staging/temporal_grounding_tg1_retry500_v1
  LOG_DIR=$REPO/logs/temporal_grounding/entrypoint
  mkdir -p "$LOG_DIR" /home/tim/workspace
  exec > >(tee -a "$LOG_DIR/tg1b_${TG1B_CHECKPOINT_ARM}_e${TG1B_EXECUTION_CADENCE}_north_$(date -u +%Y%m%d_%H%M%S).log") 2>&1
  test -s "$REPO/logs/resource_markers/temporal_grounding_tg1_retry500_north_stage.ok"
  test "$(cat "$REPO/lmvla/lawam/.source_commit")" = 7ca170c9b98e15026ecd9004d91f0ad9c73ba5f7
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"
  HF_OVERLAY=/vePFS-North-E/vis_robot/workspace/tim/runtime/tg2_transformers_5_2_py312_padding_v3
  test -f "$HF_OVERLAY/transformers/__init__.py"
  SERVER_PY=/tmp/tg1b_lawam_server_python.sh
  cat > "$SERVER_PY" <<EOF
  #!/usr/bin/env bash
  export PYTHONPATH="$HF_OVERLAY\${PYTHONPATH:+:\$PYTHONPATH}"
  exec "$REPO/kai0/.venv/bin/python" "\$@"
  EOF
  chmod +x "$SERVER_PY"
  export STAR_VLA_PYTHON=$SERVER_PY
  cd "$REPO/lmvla/lawam"
  "$STAR_VLA_PYTHON" - <<'PY'
  import transformers
  from transformers import AutoProcessor
  processor = AutoProcessor.from_pretrained(
      "results/Checkpoints/qwen3_weights", local_files_only=True
  )
  assert type(processor).__name__ == "Qwen3VLProcessor", type(processor).__name__
  assert hasattr(processor, "tokenizer")
  print("TG1B_NORTH_RUNTIME_OK", transformers.__version__, flush=True)
  PY
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$ROOT/lmvla/lawam/robotwin_python_wrapper_northe.sh
  export TORCH_CUDA_ARCH_LIST=9.0
  "$ROBOTWIN_PYTHON" -c 'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  RESULT_ROOT="$REPO/lmvla/lawam/results/eval_runs/robotwin/temporal_grounding_tg1b_${TG1B_CHECKPOINT_ARM}_e${TG1B_EXECUTION_CADENCE}"
  if [[ -e "$RESULT_ROOT" ]]; then
    summary_count=$(find "$RESULT_ROOT" -type f -name summary.json | wc -l)
    test "$summary_count" -eq 0
    archive="${RESULT_ROOT}.failed_north_runtime_v1.$(date -u +%Y%m%d_%H%M%S)"
    mv "$RESULT_ROOT" "$archive"
    echo "archived empty failed-runtime result root: $archive"
  fi
  REPO_ROOT="$REPO" bash "$REPO/train_scripts/kai/eval/run_temporal_grounding_tg1b_retry500_formal.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
