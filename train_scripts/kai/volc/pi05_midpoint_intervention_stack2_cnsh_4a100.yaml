TaskName: "pi05-actionfix-intervention-stack2-cnsh4g"
Description: "Action-fixed A2/A3 step-20k paired current/zero Stack-2 diagnostics"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.14xlarge"

ActiveDeadlineSeconds: 21600
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/pi05_midpoint_intervention_stack2_${STAMP}.log" 2>&1
  set -x

  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"
  mkdir -p /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  "$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh" -c \
    'import sapien.core as sapien; import mplib; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'

  arms=(a2_abs a2_abs a3_live a3_live)
  interventions=(zero current zero current)
  ports=(23800 23900 24000 24100)
  pids=""
  status=0
  for gpu in 0 1 2 3; do
    arm=${arms[$gpu]}
    intervention=${interventions[$gpu]}
    env \
      ARM=$arm \
      GPU_INDEX=$gpu \
      PORT_BASE_OFFSET=${ports[$gpu]} \
      STEP=20000 \
      TASK_NAME=stack_blocks_two \
      INTERVENTION=$intervention \
      RESULT_SUFFIX=_${intervention}_actionfix_cnsh \
      bash "$REPO/train_scripts/kai/eval/run_pi05_confirmatory_midpoint_probe.sh" \
      > "$LOG_DIR/pi05_midpoint_${arm}_${intervention}_${STAMP}.log" 2>&1 &
    pids="$pids $!"
    sleep 20
  done
  for pid in $pids; do wait "$pid" || status=1; done

  if [ "$status" -eq 0 ]; then
    mkdir -p "$REPO/logs/resource_markers"
    printf 'validated=%s\narms=4\ntask=stack_blocks_two\n' "$(date -u +%FT%TZ)" \
      > "$REPO/logs/resource_markers/pi05_actionfix_intervention_stack2_step20000_cnsh.ok"
  fi
  exit "$status"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
