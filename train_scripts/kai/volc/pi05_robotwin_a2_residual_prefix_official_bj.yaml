# RoboTwin official-aligned pi05 + residual LMWM So400m prefix hint.

TaskName: "pi05-robotwin-a2-res-prefix-official-bj"
Description: "official-aligned RoboTwin pi05 A2 residual So400m prefix: horizon50 adapt_to_piFalse bs64 steps20k"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 172800
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_robotwin
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/pi05_robotwin_a2_residual_prefix_official_bj_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== pi05_robotwin_a2_residual_prefix_official_bj start $(date -u) ==="

  cd $REPO/kai0
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export HF_HOME=$REPO/datasets/.hf_cache
  export HF_DATASETS_CACHE=$HF_HOME/datasets
  export JAX_COMPILATION_CACHE_DIR=$REPO/.cache/jax
  mkdir -p "$HF_DATASETS_CACHE" "$JAX_COMPILATION_CACHE_DIR"

  DATA=/vePFS-North-E/vis_robot/huanqian/uniVP/data/robotwin2.0/robotwin2.0
  INIT=/vePFS-North-E/vis_robot/base_init_ckpts/extracted/pi05_base/params
  HINT=$REPO/lmvla/lmwm/data/pi05_hint/robotwin_so400m_residual/hint.npz
  A0_NORM=$REPO/kai0/assets/pi05_robotwin_a0_official_bj/robotwin2.0/norm_stats.json
  A2_NORM_DIR=$REPO/kai0/assets/pi05_robotwin_a2_residual_prefix_official_bj/robotwin2.0
  [ -d "$DATA/meta" ] || { echo "FATAL: dataset missing $DATA" >&2; exit 13; }
  [ -f "$INIT/_METADATA" ] || { echo "FATAL: pi05_base init missing $INIT" >&2; exit 17; }
  [ -f "$HINT" ] || { echo "FATAL: A2 residual hint missing $HINT" >&2; exit 18; }
  [ -f "$A0_NORM" ] || { echo "FATAL: official A0 norm missing $A0_NORM" >&2; exit 19; }
  mkdir -p "$A2_NORM_DIR"
  cp -f "$A0_NORM" "$A2_NORM_DIR/norm_stats.json"

  EXP=pi05_robotwin_a2_residual_prefix_official
  CKPT_DIR=$REPO/kai0/checkpoints/pi05_robotwin_a2_residual_prefix_official_bj/$EXP
  if ls -d "$CKPT_DIR"/[0-9]*/ >/dev/null 2>&1; then RESUME_FLAG="--resume"; else RESUME_FLAG="--overwrite"; fi
  exec python -u scripts/train.py pi05_robotwin_a2_residual_prefix_official_bj \
    --exp-name "$EXP" \
    --num-workers 8 \
    --no-wandb-enabled \
    $RESUME_FLAG

RetryOptions:
  EnableRetry: true
  MaxRetryTimes: 3

AccessType: "Public"
