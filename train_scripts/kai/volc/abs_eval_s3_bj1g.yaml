# shape A/B dual2q LIBERO eval — 北京 Robot-North-H20 单卡1路(North-E, ckpt原地). __占位__ 生成器替换.
#   dual2q 注入 env 照搬已验证 libero_eval_dual2q_3suite 模板. osmesa. SUITES=libero_10 libero_spatial.
#   对照 nowm96.5/t+7 93.35/detach93.25. 4 个此类 job(seed0-3)= 4 路.
TaskName: "abs025-nots-seed3-bj1g"
Description: "shape shapeA_t7only dual2q eval seed3 北京North-H20 单卡"
Tags: []
ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Preemptible: false
Framework: "PyTorch"
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.5xlarge"
ActiveDeadlineSeconds: 28800
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
Entrypoint: |
  set -uo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_eval; mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/shapeeval_shapeA_t7only_seed3_${STAMP}.log" 2>&1
  set -x
  echo "=== shape shapeA_t7only seed3 eval start $(date -u) (北京) ==="
  CKPT=/vePFS-North-E/vis_robot/workspace/deepdive_kai0/lmvla/lawam/results/Checkpoints/libero/20260728_051004+lmwm_2q_abs025_noTs_cnbj_volc/checkpoints/steps_12500_pytorch_model.pt
  export RUN_GROUP=abs025_nots
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON LIBERO_PYTHON=$PYTHON
  cd $REPO/lmvla/lawam
  nvidia-smi -L | head
  [ -f "$CKPT" ] || { echo "FATAL: ckpt 不存在 $CKPT" >&2; exit 13; }
  env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
    $PYTHON -m pip install -q -i https://mirrors.aliyun.com/pypi/simple/ \
    'robosuite==1.4.1' mujoco opencv-python-headless tyro websockets json-numpy 2>&1 | tail -2
  LH=$REPO/lmvla/LIBERO; mkdir -p "$LH/libero"
  {
    echo "benchmark_root: $LH/libero/libero"
    echo "bddl_files: $LH/libero/libero/bddl_files"
    echo "init_states: $LH/libero/libero/init_files"
    echo "datasets: $LH/libero/libero/../datasets"
    echo "assets: $LH/libero/libero/assets"
  } > "$LH/libero/config.yaml"
  rm -f /root/.libero/config.yaml 2>/dev/null || true
  $PYTHON -c "from starVLA.model.framework.vlas.lawam import LatentWorldPolicyBackend; print('Backend OK')"
  export LMWM_CKPT=$REPO/lmvla/lmwm/checkpoints/lmwm_libero_rvalley/lmwm.pt
  export LMWM_ADAPTER_DIR=$REPO/lmvla/lmwam/adapter
  export LMWM_SWAP_TEACHER=1 LMWM_DUAL=1 LMWM_DUAL_2Q=1
  export LMWM_MS_ABS_SCALE=0.25
  unset LMWM_MILESTONE_TARGET LMWM_TARGET_COMPACT LMWM_MS_TSCHED LMWM_HINT_DROPOUT
  [ -f "$LMWM_CKPT" ] || { echo "FATAL: LMWM ckpt 缺 $LMWM_CKPT" >&2; exit 13; }
  export SUITES="libero_10 libero_spatial"
  export NUM_TRIALS_PER_TASK=50 NUM_WORKERS=25
  export MUJOCO_GL=osmesa SERVER_STARTUP_TIMEOUT_SEC=1200
  export OUTPUT_ROOT=$REPO/lmvla/lawam/results/eval_runs/libero
  export GPU_IDS=0 EVAL_GPU_IDS=0 PORT_BASE=28600
  export EVAL_SEED=3 LIBERO_RUN_GROUP=$RUN_GROUP RUN_TAG=abs025_s3
  echo "[seed3] ckpt=$CKPT group=$RUN_GROUP seed=3 $(date -u)"
  bash examples/LIBERO/eval_files/auto_eval_scripts/run_libero_benchmark.sh "$CKPT"
  echo "=== shape shapeA_t7only seed3 DONE rc=$? $(date -u) ==="
RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0
AccessType: "Public"
