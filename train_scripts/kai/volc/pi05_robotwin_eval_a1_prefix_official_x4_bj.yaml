TaskName: "pi05-robotwin-a1-prefix-official-eval-x4"
Description: "official-aligned pi05 RoboTwin A1 prefix eval: horizon50/replan50, 6 tasks x 50 trials x 4 seeds"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/pi05_rteval_a1_prefix_official_x4_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== pi05_robotwin_a1_prefix_official eval x4 start $(date -u) ==="

  mkdir -p /home/tim/workspace && ln -sfn $REPO /home/tim/workspace/deepdive_kai0
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  cd $REPO/lmvla/lawam

  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG=pi05_robotwin_a1_prefix_official_eval_bj
  export ROBOTWIN_HINT_ENCODER=dinov3-base
  export OPENPI_SERVE_SCRIPT=$REPO/kai0/scripts/serve_policy.py
  export KAI0_ROOT=$REPO/kai0
  export ROBOTWIN_MODEL_INTERFACE=openpi

  CKPT_ROOT=$REPO/kai0/checkpoints/pi05_robotwin_a1_prefix_official_bj/pi05_robotwin_a1_prefix_official
  CKPT="${CKPT:-$(find "$CKPT_ROOT" -maxdepth 1 -type d -regex '.*/[0-9]+' | sort -V | tail -1)}"
  [ -n "$CKPT" ] || { echo "FATAL: no numeric ckpt under $CKPT_ROOT" >&2; exit 13; }
  [ -d "$CKPT/params" ] || { echo "FATAL: openpi ckpt missing params/: $CKPT" >&2; exit 13; }
  [ -f "$CKPT/assets/robotwin2.0/norm_stats.json" ] || { echo "FATAL: ckpt missing assets/robotwin2.0/norm_stats.json: $CKPT" >&2; exit 13; }
  echo "[$(date)] CKPT=$CKPT"

  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  [ -d "$ROBOTWIN_PATH/envs" ] || { echo "FATAL: RoboTwin missing $ROBOTWIN_PATH" >&2; exit 13; }
  [ -x "$ROBOTWIN_PYTHON" ] || { echo "FATAL: wrapper not executable $ROBOTWIN_PYTHON" >&2; exit 13; }
  "$ROBOTWIN_PYTHON" -c "import sapien, mplib" 2>/dev/null || { echo "FATAL: wrapper missing sapien/mplib" >&2; exit 13; }
  export PYTHONPATH="$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  "$ROBOTWIN_PYTHON" -c "import openpi_client.websocket_client_policy" 2>/dev/null || "$ROBOTWIN_PYTHON" -m pip install -q websockets msgpack

  export ROBOTWIN_TASKS="beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three"
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM=50
  export ROBOTWIN_NUM_SLOTS=1
  export NUM_WORKERS=1
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_INSTRUCTION_TYPE=unseen
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=50
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST="9.0"

  NREP=4
  pids=""
  for i in $(seq 0 $((NREP-1))); do
    (
      export CUDA_VISIBLE_DEVICES=$i
      export SEED=$i
      export PORT_BASE=$((7700 + i*40))
      export ROBOTWIN_EVAL_ROOT=$REPO/lmvla/lawam/results/eval_runs/robotwin/pi05_rt_a1_prefix_official/seed$i
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh "$CKPT" "$TASK_CONFIG" "unseen-a1-seed$i"
    ) > "$LOG_DIR/pi05_rteval_a1_prefix_official_x4_${STAMP}_seed${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 25
  done
  for p in $pids; do wait $p; done
  echo "=== pi05_robotwin_a1_prefix_official eval x4 DONE $(date -u) ==="

RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0

AccessType: "Public"
