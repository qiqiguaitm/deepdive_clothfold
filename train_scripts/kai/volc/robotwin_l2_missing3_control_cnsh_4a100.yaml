TaskName: "robotwin-l2-missing3-control-cnsh4g"
Description: "One parameterized RoboTwin L2 control on the three missing tasks"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.14xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: ALL6_EVAL_VARIANT
    Value: "absolute"
  - Name: ALL6_TRAIN_SEED
    Value: "2026"
  - Name: ALL6_EVAL_RUN_BASENAME
    Value: "latest"
  - Name: L2_CONTROL
    Value: "zero"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LAWAM=$REPO/lmvla/lawam
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$LAWAM/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/l2_${L2_CONTROL}_${ALL6_EVAL_VARIANT}_seed${ALL6_TRAIN_SEED}_${STAMP}.log" 2>&1
  set -x

  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"
  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"
  "$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  nvidia-smi -L

  env \
    ALL6_EVAL_VARIANT="$ALL6_EVAL_VARIANT" \
    ALL6_EVAL_RUN_BASENAME="$ALL6_EVAL_RUN_BASENAME" \
    ALL6_TRAIN_SEED="$ALL6_TRAIN_SEED" \
    L2_CONTROL="$L2_CONTROL" \
    SEEDS="0 1 2 3" \
    GPUS_PER_SEED=1 \
    LOCAL_GPU_COUNT=4 \
    NUM_WORKERS=1 \
    ROBOTWIN_NUM_SLOTS=1 \
    bash "$REPO/train_scripts/kai/eval/local_robotwin_l2_missing3_control.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
