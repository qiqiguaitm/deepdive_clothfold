# pi05 × LMWM 实验 A1-suffix (DINOv3 768D) — LIBERO 四套件, cnbj 1-host 8 H20, 30k
#   = 上海 pi05_libero_a1_suffix_east.yaml 迁北京版(上海 Robot-East-H20 排队久, 用户要求迁北京补矩阵)。
#   Config: pi05_libero_a1_suffix_bj (config.py:1178, 已定义, datasets_yaml=northe/hint=dino/init=North-E)
#   Data:   uniVP libero_{10,goal,object,spatial}_no_noops_lerobot (北京原生, 同 a2_suffix_bj)
#   hint:   lmvla/lmwm/data/pi05_hint/libero_dino/hint.npz (394MB, North-E 已在, 零同步)
#   norm:   kai0/assets/pi05_libero_a1_suffix_bj/libero_4suites/norm_stats.json (复用 a2_suffix_bj 的,
#           state/actions dim=32 与 a1 同, hint 独立注入不进 norm → 复用有效)
#   ⚠️ 纯 openpi pi05 JAX. ⚠️ a1=dino 路(§5 评估易 LMWM 坍缩), 价值=补 prefix/suffix 矩阵。
# Submit: kai0/.venv/bin/python train_scripts/kai/volc/submit_yaml.py train_scripts/kai/volc/pi05_libero_a1_suffix_bj.yaml
TaskName: "pi05-libero-a1-suffix-bj"
Description: "pi05 LIBERO A1-suffix (DINOv3 768D): JAX 1-host 8 H20 北京, warm-start pi05_base, 30k, 非抢占"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false              # 非抢占(用户规矩: 统一非闲时提交)

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.hpcpni3ln.45xlarge"   # 8× H20-SXM5-96GB single node

ActiveDeadlineSeconds: 1209600  # 14 天/run
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: NCCL_DEBUG
    Value: "WARN"
  - Name: OMP_NUM_THREADS
    Value: "8"
  - Name: XLA_PYTHON_CLIENT_MEM_FRACTION
    Value: "0.85"
  - Name: JAX_COMPILATION_CACHE_MIN_ENTRY_SIZE_BYTES
    Value: "-1"
  - Name: JAX_COMPILATION_CACHE_MIN_COMPILE_TIME_SECS
    Value: "1"
  - Name: JAX_ENABLE_EMPTY_ARRAYS
    Value: "true"

Entrypoint: |
  set -uo pipefail
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  NODE=${MLP_ROLE_INDEX:-0}
  LOG_DIR=/vePFS-North-E/vis_robot/logs
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/pi05_libero_a1_suffix_bj_${STAMP}_node${NODE}.log"
  exec >> "$LOG" 2>&1
  echo "=== a1-suffix-bj entrypoint start $(date) (1-host 8 H20, 非抢占) ==="
  set -x
  nvidia-smi -L
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  cd "$REPO/kai0"
  source .venv/bin/activate
  apt-get update 2>&1 | tail -1 && apt-get install -y ffmpeg 2>&1 | tail -2 || echo "ffmpeg best-effort"
  python -c "import jax; print(f'jax {jax.__version__} devs={len(jax.devices())}')"

  # 视频解码 preflight: openpi data_loader 用 pyav (非 torchcodec).
  python - <<'PYEOF' || { echo "FATAL: pyav 视频解码不可用" >&2; exit 13; }
  import glob
  from lerobot.common.datasets.video_utils import decode_video_frames
  v = sorted(glob.glob("/vePFS-North-E/vis_robot/huanqian/uniVP/data/libero_mujoco3.3.2/libero_10_no_noops_lerobot/videos/**/*.mp4", recursive=True))[:1]
  f = decode_video_frames(v[0], [0.0, 0.05], 30.0, "pyav")
  print("PYAV DECODE OK shape=", tuple(f.shape))
  PYEOF

  # preflight: 四套件 + norm + hint(dino) + pi05_base init
  DATA=/vePFS-North-E/vis_robot/huanqian/uniVP/data/libero_mujoco3.3.2
  INIT=/vePFS-North-E/vis_robot/base_init_ckpts/extracted/pi05_base/params
  NORM=$REPO/kai0/assets/pi05_libero_a1_suffix_bj/libero_4suites/norm_stats.json
  for S in libero_10 libero_goal libero_object libero_spatial; do
    [ -f "$DATA/${S}_no_noops_lerobot/meta/info.json" ] || { echo "FATAL: LIBERO suite missing: $S" >&2; exit 13; }
  done
  HINT=$REPO/lmvla/lmwm/data/pi05_hint/libero_dino/hint.npz
  [ -f "$HINT" ] || { echo "FATAL: A1 dino hint missing $HINT" >&2; exit 13; }
  [ -f "$NORM" ]           || { echo "FATAL: norm_stats missing $NORM (先复制 a2_suffix_bj 的 norm)" >&2; exit 13; }
  [ -f "$INIT/_METADATA" ] || { echo "FATAL: pi05_base init missing $INIT" >&2; exit 13; }
  echo "[$(date)] preflight OK (4 LIBERO suites + norm + dino hint + pi05_base init)"

  # 自动 resume
  EXP=pi05_libero_a1_suffix
  CKPT_DIR=$REPO/kai0/checkpoints/pi05_libero_a1_suffix_bj/$EXP
  if ls -d "$CKPT_DIR"/[0-9]*/ >/dev/null 2>&1; then RESUME_FLAG="--resume"; echo "[resume] found ckpt -> --resume"; else RESUME_FLAG="--overwrite"; echo "[resume] fresh --overwrite"; fi

  exec python -u scripts/train.py pi05_libero_a1_suffix_bj \
    --exp-name "$EXP" \
    --no-wandb-enabled \
    --save-interval 1000 \
    $RESUME_FLAG

RetryOptions:
    EnableRetry: true
    MaxRetryTimes: 10

AccessType: "Public"
