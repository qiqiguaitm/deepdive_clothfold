# Repair corrupt So400m episode grids, validate the full cache, then export A2 hints.
TaskName: "robotwin-so400m-repair-export-bj1g"
Description: "Repair corrupt So400m grids and export absolute/residual A2 hints from completed LMWM"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.5xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"

Entrypoint: |
  set -euo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  export RT_REPO=$REPO
  PY=$REPO/kai0/.venv/bin/python
  SC=$REPO/lmvla/lmwm/scripts
  GRID=$REPO/lmvla/lmwm/data/robotwin_so400m_grid
  FEATROOT=$REPO/lmvla/lmwm/data/robotwin_so400m_feat_pi05
  CKPT=$REPO/lmvla/lmwm/checkpoints/lmwm_robotwin_so400m/lmwm.pt
  ABS=$REPO/lmvla/lmwm/data/pi05_hint/robotwin_so400m
  RES=$REPO/lmvla/lmwm/data/pi05_hint/robotwin_so400m_residual
  LOG_DIR=$REPO/lmvla/lmwm/logs
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG=$LOG_DIR/robotwin_so400m_repair_export_${STAMP}.log
  BAD_EPS=$GRID/bad_eps_repair_${STAMP}.txt
  mkdir -p "$LOG_DIR" "$GRID"
  exec >> "$LOG" 2>&1
  set -x

  test -s "$GRID/BAD_FILES.txt"
  sed -E 's#^.*/ep([0-9]+)\.npz$#\1#' "$GRID/BAD_FILES.txt" | sort -n -u | paste -sd, - > "$BAD_EPS"
  test "$(tr ',' '\n' < "$BAD_EPS" | sed '/^$/d' | wc -l)" -eq 30
  while IFS= read -r path; do rm -f "$path"; done < "$GRID/BAD_FILES.txt"

  CUDA_VISIBLE_DEVICES=0 "$PY" "$SC/robotwin_so400m_grid_extract.py" \
    --eps-file "$BAD_EPS" --bs 64 --out "$GRID"

  "$PY" - "$GRID" <<'PYEOF'
  import glob
  import os
  import sys
  import zipfile
  from concurrent.futures import ThreadPoolExecutor

  root = sys.argv[1]
  files = glob.glob(root + "/ep*.npz")
  def check(path):
      try:
          with zipfile.ZipFile(path) as z:
              return None if "grid.npy" in z.namelist() else (path, "missing grid.npy")
      except Exception as exc:
          return (path, f"{type(exc).__name__}: {exc}")
  with ThreadPoolExecutor(max_workers=64) as pool:
      bad = [item for item in pool.map(check, files) if item]
  print("GRID_VALIDATION", len(files), "BAD", len(bad), bad[:20], flush=True)
  assert len(files) == 27500
  assert not bad, bad
  PYEOF

  test -s "$CKPT"
  mkdir -p "$FEATROOT"
  ln -sfn "$GRID" "$FEATROOT/robotwin"
  rm -rf "$ABS" "$RES"
  CUDA_VISIBLE_DEVICES=0 "$PY" "$SC/export_pi05_hint.py" \
    --ckpt "$CKPT" --feat-root "$FEATROOT" --out "$ABS" --K 1 --batch 128
  test -s "$ABS/hint.npz"
  "$PY" "$SC/make_pi05_residual_hint.py" \
    --hint "$ABS/hint.npz" --feat-root "$FEATROOT" --out "$RES"
  test -s "$RES/hint.npz"
  ls -lh "$CKPT" "$ABS/hint.npz" "$RES/hint.npz"
  echo "=== robotwin_so400m_repair_export DONE $(date -u) ==="

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
