TaskName: "pi05-r4-outcome-collection-east4g"
Description: "Action-bearing, outcome-labeled pi0.5 RoboTwin trajectory collection"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 172800
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%SZ)
  LOG_DIR=$REPO/logs/r4/outcomes/platform
  mkdir -p "$LOG_DIR"
  exec >>"$LOG_DIR/${RESULT_NAME:-pi05_r4_outcomes_public_v1}_${STAMP}.log" 2>&1
  set -x
  exec env REPO="$REPO" LOCAL_GPU_COUNT=4 \
    bash "$REPO/train_scripts/kai/eval/run_pi05_r4_outcome_collection.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
