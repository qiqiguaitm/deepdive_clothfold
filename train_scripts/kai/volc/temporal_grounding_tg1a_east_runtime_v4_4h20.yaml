TaskName: "temporal-grounding-tg1a-east4g"
Description: "Frozen released-LaWAM TG1A paired content intervention with pinned policy runtime"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: TG1A_CONDITION
    Value: "normal"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LOG_DIR="$REPO/logs/temporal_grounding/entrypoint"
  mkdir -p "$LOG_DIR"
  LOG_FILE="$LOG_DIR/tg1a_${TG1A_CONDITION}_$(date -u +%Y%m%d_%H%M%S).log"
  exec > >(tee -a "$LOG_FILE") 2>&1
  echo "TG1A_ENTRYPOINT_START condition=$TG1A_CONDITION host=$(hostname)"
  git config --global --add safe.directory "$REPO"
  git config --global --add safe.directory "$REPO/lmvla/lawam"
  test -f "$REPO/logs/resource_markers/robotwin_renderer_east.ok"
  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"
  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"
  "$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  export STAR_VLA_PYTHON=/vePFS/tim/workspace/miniconda3_gf0/envs/lawam/bin/python
  test -x "$STAR_VLA_PYTHON"
  cd "$REPO/lmvla/lawam"
  "$STAR_VLA_PYTHON" - <<'PY'
  import sys
  import transformers
  from transformers import AutoProcessor
  processor = AutoProcessor.from_pretrained(
      "results/Checkpoints/qwen3_weights", local_files_only=True
  )
  assert type(processor).__name__ == "Qwen3VLProcessor", type(processor).__name__
  assert hasattr(processor, "tokenizer")
  print(
      "TG_POLICY_RUNTIME_OK",
      sys.executable,
      transformers.__version__,
      type(processor).__name__,
      type(processor.tokenizer).__name__,
  )
  PY
  cd "$REPO"
  FEATURE_ROOT="$REPO/logs/temporal_grounding/tg1a/predicted_endpoint_features"
  CAPTURE_MARKER="$REPO/logs/temporal_grounding/tg1a/normal_capture_complete.json"
  if [[ "$TG1A_CONDITION" == normal && -d "$FEATURE_ROOT" && ! -e "$CAPTURE_MARKER" ]]; then
    if find "$FEATURE_ROOT" -mindepth 1 -print -quit | grep -q .; then
      echo "refusing to archive non-empty failed feature root: $FEATURE_ROOT" >&2
      exit 4
    fi
    mv "$FEATURE_ROOT" "${FEATURE_ROOT}.failed_runtime_v3"
  fi
  LOCAL_GPU_COUNT=4 REPO_ROOT="$REPO" \
    bash "$REPO/train_scripts/kai/eval/run_temporal_grounding_tg1a_formal.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
