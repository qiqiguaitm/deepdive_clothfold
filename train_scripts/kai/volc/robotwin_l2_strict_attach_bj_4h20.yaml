TaskName: "robotwin-l2-strict-attach-bj4g"
Description: "Attach four non-resetting workers to an active strict L2 evaluation"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: L2_STRICT_METHOD
    Value: "residual"
  - Name: L2_STRICT_CONTROL
    Value: "zero"
  - Name: ROBOTWIN_WORKER_INDEX_OFFSET
    Value: "22000"
  - Name: ATTACH_MARKER_NAME
    Value: "l2_strict_attach_residual_zero_north"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  mkdir -p "$LOG_DIR" /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  exec >> "$LOG_DIR/l2_strict_attach_${L2_STRICT_METHOD}_${L2_STRICT_CONTROL}_${STAMP}.log" 2>&1
  set -x

  export REPO_ROOT=$REPO
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  export TORCH_CUDA_ARCH_LIST=9.0
  env SEEDS="0 1 2 3" GPUS_PER_SEED=1 LOCAL_GPU_COUNT=4 \
    NUM_WORKERS=1 ROBOTWIN_NUM_SLOTS=1 \
    bash "$REPO/train_scripts/kai/eval/local_robotwin_l2_strict_attach.sh"

  mkdir -p "$REPO/logs/resource_markers"
  printf 'completed=%s method=%s control=%s\n' \
    "$(date -u +%FT%TZ)" "$L2_STRICT_METHOD" "$L2_STRICT_CONTROL" \
    > "$REPO/logs/resource_markers/${ATTACH_MARKER_NAME}.ok"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
