# [B/RoboTwin] GATE ckpt eval, 6 block tasks x 4 seeds.
TaskName: "robotwin-eval-gate-balanced-x4"
Description: "RoboTwin blocks: balanced GATE dual2q ckpt, 4 seeds, single ckpt"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/rteval_gate_balanced_x4_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== RoboTwin GATE balanced eval x4 start $(date -u) ==="

  mkdir -p /home/tim/workspace && ln -sfn $REPO /home/tim/workspace/deepdive_kai0

  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  cd $REPO/lmvla/lawam

  NE=$REPO/lmvla/lawam/results/Checkpoints/robotwin
  CKPT=$NE/20260728_000543+robotwin_lmwm_dual2q_balanced_gate_bj/checkpoints/steps_20000_pytorch_model.pt
  export RUN_GROUP=rt_lmwm_dual2q_balanced_gate
  NREP=4

  nvidia-smi -L | head -4
  [ -f "$CKPT" ] || { echo "FATAL: ckpt missing $CKPT" >&2; exit 13; }
  RUN_DIR=$(dirname $(dirname "$CKPT"))
  for f in config.yaml dataset_statistics.json; do
    [ -f "$RUN_DIR/$f" ] || { echo "FATAL: missing $RUN_DIR/$f" >&2; exit 13; }
  done

  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  [ -d "$ROBOTWIN_PATH/envs" ] || { echo "FATAL: RoboTwin missing $ROBOTWIN_PATH" >&2; exit 13; }
  export ROBOTWIN_TASKS="beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three"
  for t in $ROBOTWIN_TASKS; do
    [ -f "$ROBOTWIN_PATH/envs/$t.py" ] || { echo "FATAL: missing task $t" >&2; exit 13; }
  done
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM=50
  export ROBOTWIN_NUM_SLOTS=1
  export NUM_WORKERS=1
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0

  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  [ -x "$ROBOTWIN_PYTHON" ] || { echo "FATAL: wrapper not executable $ROBOTWIN_PYTHON" >&2; exit 13; }
  "$ROBOTWIN_PYTHON" -c "import sapien, mplib, json_numpy" 2>/dev/null || { echo "FATAL: wrapper missing sapien/mplib/json_numpy" >&2; exit 13; }
  export TORCH_CUDA_ARCH_LIST="9.0"

  LMWM_PT=$REPO/lmvla/lmwm/checkpoints/lmwm_robotwin_rvalley/lmwm.pt
  [ -f "$LMWM_PT" ] || { echo "FATAL: LMWM missing $LMWM_PT" >&2; exit 13; }

  echo "[$(date)] preflight OK; ckpt=$CKPT group=$RUN_GROUP tasks=$ROBOTWIN_TASKS"

  pids=""
  for i in $(seq 0 $((NREP-1))); do
    (
      export CUDA_VISIBLE_DEVICES=$i
      export SEED=$i
      export PORT_BASE=$((6700 + i*40))
      export LMWM_CKPT=$LMWM_PT
      export LMWM_ADAPTER_DIR=$REPO/lmvla/lawam
      export LMWM_SWAP_TEACHER=1
      export LMWM_DUAL=1
      export LMWM_DUAL_2Q=1
      export LMWM_FEAT_STRIDE=1
      unset LMWM_MILESTONE_TARGET LMWM_TARGET_COMPACT LMWM_MS_TSCHED LMWM_HINT_DROPOUT LMWM_MS_GATE LMWM_MS_RESIDUAL LMWM_MS_ABS_SCALE
      export ROBOTWIN_EVAL_ROOT=$REPO/lmvla/lawam/results/eval_runs/robotwin/$RUN_GROUP/seed$i
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      echo "[gate seed$i] GPU=$i start $(date -u)"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh "$CKPT" "$TASK_CONFIG" "seed$i"
      echo "[gate seed$i] done rc=$? $(date -u)"
    ) > "$LOG_DIR/rteval_gate_balanced_x4_${STAMP}_seed${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 25
  done
  echo "[$(date)] started $NREP seeds: $pids"
  for p in $pids; do wait $p; done
  echo "[$(date)] all seeds finished"

  export RUN_GROUP
  $PYTHON - <<'PYEOF'
  import json, glob, os, statistics as st
  root = f"{os.environ['REPO']}/lmvla/lawam/results/eval_runs/robotwin/{os.environ['RUN_GROUP']}"
  per_seed = {}
  for f in sorted(glob.glob(f"{root}/seed*/**/tasks/*/summary.json", recursive=True)):
      try:
          d = json.load(open(f))
      except Exception:
          continue
      if not isinstance(d, dict) or "success_rate" not in d:
          continue
      sd = f.split("/seed")[1].split("/")[0]
      per_seed.setdefault(sd, {})[d.get("task_name", os.path.basename(os.path.dirname(f)))] = float(d["success_rate"])
  print("\n============ RoboTwin GATE balanced x4 summary ============")
  tasks = sorted({t for v in per_seed.values() for t in v})
  for sd in sorted(per_seed):
      row = per_seed[sd]
      print(f"seed{sd}: " + " ".join(f"{t}={row.get(t, float('nan')):.2f}" for t in tasks))
  for t in tasks:
      vs = [per_seed[s][t] for s in per_seed if t in per_seed[s]]
      if vs:
          print(f"  {t:24s} mean={st.mean(vs):6.3f} n={len(vs)}")
  allv = [per_seed[s][t] for s in per_seed for t in per_seed[s]]
  if allv:
      print(f"aggregate={st.mean(allv):.3f} n={len(allv)}")
  print("==========================================================\n")
  PYEOF

  echo "=== RoboTwin GATE balanced eval x4 DONE $(date -u) ==="

RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0

AccessType: "Public"
