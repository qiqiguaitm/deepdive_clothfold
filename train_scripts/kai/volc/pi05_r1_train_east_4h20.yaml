TaskName: "pi05-r1-train-east4g"
Description: "P0+R0-gated recurrence-aligned pi0.5 R1 training"
Tags: []
ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"
ActiveDeadlineSeconds: 345600
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%SZ)
  mkdir -p "$REPO/logs/r1/platform"
  exec >>"$REPO/logs/r1/platform/${R1_ARM:?missing R1_ARM}_${STAMP}_east.log" 2>&1
  set -x
  exec env REPO="$REPO" GPU_COUNT=4 bash "$REPO/train_scripts/kai/run_pi05_r1_train.sh"
RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
