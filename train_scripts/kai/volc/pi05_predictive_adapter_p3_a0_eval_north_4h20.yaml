TaskName: "pi05-predictive-p3-a0-eval-north4g"
Description: "Frozen P3 matched A0 24-cell evaluation on North 4xH20"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"
ActiveDeadlineSeconds: 172800
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"

Entrypoint: |
  set -euo pipefail
  ROOT=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAGE=$ROOT/.staging/pi05_p1_failover_20260804T1034Z
  export PYTHONPATH="$STAGE/kai0/src:$ROOT/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$ROOT/lmvla/lawam/robotwin_python_wrapper_northe.sh
  export TORCH_CUDA_ARCH_LIST=9.0
  export TORCH_EXTENSIONS_DIR=/vePFS-North-E/vis_robot/tim/runtime/torch_extensions/h20_sm90_py310
  mkdir -p "$TORCH_EXTENSIONS_DIR"
  exec env REPO="$ROOT" P345_VERIFY_REPO="$ROOT" P3_EVAL_REPO="$STAGE" \
    LOCAL_GPU_COUNT=4 MAX_PARALLEL_SEEDS=4 \
    bash "$ROOT/train_scripts/kai/eval/run_pi05_predictive_adapter_p3_a0_formal.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
