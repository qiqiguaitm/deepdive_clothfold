# CRAVE→KAI0-AE 重训 · CRAVE-KAI-AE (polyline 去阶梯标签) — robot-task 8 A100, 50k
#   plan: docs/training/future_plans/plans/so400mline_kai_ae_retrain_plan.md §8
#   Config: ADVANTAGE_TORCH_SO400M (AdvantageEstimatorConfig, loss_value=1/action=0, init pi05_base strict=False)
#   Data:   so400m_stage (3055ep, CRAVE DINOv3-base img⊕proprio→双锚Viterbi→polyline stage_progress_gt 0→1;
#           底=kai0_base, videos/meta symlink→kai0_base, norm←crave_stage_A; polyline-vs-T corr 0.947 末值median 1.0)
#   目标: polyline 干净监督重训 pi0-AE → 离线看 value/advantage 是否比 AE-C(adv_est_v1/100000) 更平滑/翻转少(§5 非-circular).
# Submit: source ~/.volc_creds && kai0/.venv/bin/python train_scripts/kai/volc/submit_yaml.py train_scripts/kai/volc/adv_est_so400m_cnsh_8gpu.yaml

TaskName: "adv-est-so400m-cnsh-8gpu"
Description: "A线A/B: AE on so400m_stage (So400m-mean@30Hz v1标签 corr0.909, 对照 CRAVE_POLY 0.948), PyTorch 8 A100 50k"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.hpcpni2.28xlarge"     # 8× A100-80G

ActiveDeadlineSeconds: 259200           # 72 h cap (PyTorch AE 慢, 50k 远够)
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    SubPath: ""
    MountPath: "/vePFS"

CacheType: "Cloudfs"

Envs:
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: WANDB_MODE
    Value: "offline"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"
  - Name: TORCH_NCCL_BLOCKING_WAIT
    Value: "0"
  - Name: NCCL_ASYNC_ERROR_HANDLING
    Value: "1"

Entrypoint: |
  set -uo pipefail
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=/vePFS/tim/workspace/deepdive_kai0/logs
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/adv_est_so400m_${STAMP}.log"
  exec >> "$LOG" 2>&1
  echo "=== AE-A (so400m_stage) train start $(date) (PyTorch DDP 8 A100) ==="
  set -ex
  nvidia-smi -L

  KAI0=/vePFS/tim/workspace/deepdive_kai0/kai0
  mkdir -p /home/tim/.local/share /root/.local/share
  ln -sfn /vePFS/tim/.local/share/uv /home/tim/.local/share/uv
  ln -sfn /vePFS/tim/.local/share/uv /root/.local/share/uv
  cd "$KAI0"
  source .venv/bin/activate
  apt-get update 2>&1 | tail -1 && apt-get install -y ffmpeg 2>&1 | tail -1 || echo "ffmpeg install skipped"
  python -c "import torch; print(f'torch {torch.__version__} cuda={torch.cuda.is_available()} dev={torch.cuda.device_count()}')"

  # PRE-FLIGHT (CRAVE anchor-linear 标签; 以 kai0_base 为底; videos symlink→kai0_base; norm←kai0_base)
  TRAIN=$KAI0/data/Task_A/self_built/so400m_stage
  INIT=/vePFS/tim/workspace/deepdive_kai0/kai0/checkpoints/pi05_base/pytorch
  [ -f "$TRAIN/meta/episodes.jsonl" ] || { echo "FATAL: train data missing $TRAIN" >&2; exit 13; }
  [ -f "$TRAIN/norm_stats.json" ]     || { echo "FATAL: norm_stats missing $TRAIN" >&2; exit 13; }
  python -c "import pyarrow.parquet as pq,glob,sys; f=sorted(glob.glob('$TRAIN/data/chunk-000/*.parquet'))[0]; cols=[c.name for c in pq.read_schema(f)]; sys.exit(0 if 'stage_progress_gt' in cols else 13)" || { echo "FATAL: stage_progress_gt missing" >&2; exit 13; }
  # 视频软链能解析出真实 mp4 (crave/videos→kai0_advantage/videos→kai0_base)
  V=$(find -L "$TRAIN/videos/chunk-000/observation.images.top_head" -name '*.mp4' -print -quit 2>/dev/null)
  [ -n "$V" ] && [ -e "$V" ] || { echo "FATAL: crave video symlink 断链 (videos→kai0_base 失效?)" >&2; exit 13; }
  [ -f "$INIT/model.safetensors" ] || { echo "FATAL: pi05_base pytorch init missing $INIT" >&2; exit 13; }
  echo "[$(date)] preflight OK (so400m_stage + stage_progress_gt + norm + video resolve + pi05_base)"

  EXP=so400m
  CKPT_DIR=$KAI0/checkpoints/ADVANTAGE_TORCH_SO400M/$EXP
  RES=""
  if ls -d "$CKPT_DIR"/[0-9]*/ >/dev/null 2>&1; then RES="--resume"; echo "[resume] found ckpt → --resume"; fi

  MASTER_PORT="${TORCH_DDP_MASTER_PORT:-15843}"
  exec torchrun \
    --nnodes=1 --node_rank=0 --nproc_per_node=8 \
    --master_addr=127.0.0.1 --master_port=$MASTER_PORT \
    scripts/train_pytorch.py ADVANTAGE_TORCH_SO400M \
    --exp_name=$EXP \
    --save_interval 10000 \
    --batch-size 144 \
    $RES

RetryOptions:
    EnableRetry: true
    MaxRetryTimes: 2

AccessType: "Public"
