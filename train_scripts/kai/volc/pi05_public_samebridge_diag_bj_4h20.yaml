TaskName: "pi05-public-samebridge-diag-bj4g"
Description: "Time one public pi0.5 RoboTwin episode on Beijing H20"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 7200
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  LAWAM=$REPO/lmvla/lawam
  MODEL=/vePFS-North-E/vis_robot/tim/hf_models/SidneyXie_pi05_robotwin
  TOKENIZER=/vePFS-North-E/vis_robot/tim/hf_models/paligemma_tokenizer
  SERVER_PY=/vePFS-North-E/vis_robot/tim/workspace/lerobot-pi05-server-venv/bin/python
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG=$LAWAM/logs/volc_rteval/pi05_public_samebridge_diag_bj_${STAMP}.log
  mkdir -p "$(dirname "$LOG")"
  exec > >(tee "$LOG") 2>&1
  set -x

  export TORCH_EXTENSIONS_DIR=/vePFS-North-E/vis_robot/tim/runtime/torch_extensions/h20_sm90_py310
  export TORCHINDUCTOR_CACHE_DIR=/vePFS-North-E/vis_robot/tim/runtime/torchinductor/pi05_h20_torch211
  mkdir -p "$TORCH_EXTENSIONS_DIR" "$TORCHINDUCTOR_CACHE_DIR"
  test -f "$MODEL/model.safetensors"
  test -f "$TOKENIZER/tokenizer.model"
  test -x "$SERVER_PY"
  export STAR_VLA_PYTHON=$SERVER_PY
  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG=lerobot_pi05
  export OPENPI_SERVE_SCRIPT=$REPO/train_scripts/kai/eval/serve_lerobot_pi05.py
  export PALIGEMMA_TOKENIZER_PATH=$TOKENIZER
  export KAI0_ROOT=$REPO
  export ROBOTWIN_MODEL_INTERFACE=openpi
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$LAWAM/robotwin_python_wrapper_northe.sh
  export PYTHONPATH="/vePFS-North-E/vis_robot/tim/workspace/lerobot-main/src:$REPO/kai0/packages/openpi-client/src:$REPO/kai0/src:${PYTHONPATH:-}"
  export ROBOTWIN_TASKS=beat_block_hammer
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM=1
  export ROBOTWIN_NUM_SLOTS=1
  export NUM_WORKERS=1
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_INSTRUCTION_TYPE=unseen
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=50
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST=9.0
  export SEED=0
  export PORT_BASE=10300
  export ROBOTWIN_CKPT_ALIAS=SidneyXie_pi05_robotwin
  export ROBOTWIN_EVAL_ROOT=$LAWAM/results/eval_runs/robotwin/pi05_public_samebridge_diag_v1

  "$ROBOTWIN_PYTHON" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  cd "$LAWAM"
  bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh \
    "$MODEL" "$TASK_CONFIG" "public-samebridge-diag-seed0-bj-$STAMP"

  summary_count=$(find "$ROBOTWIN_EVAL_ROOT" -name summary.json -type f | wc -l)
  test "$summary_count" -ge 1
  echo "PUBLIC_SAMEBRIDGE_DIAG_OK summaries=$summary_count"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
