TaskName: "pi05-robotwin-a3-live-resid-official-east"
Description: "Official-aligned RoboTwin pi05 A3 live-target residual prefix, Shanghai East 4xH20"
Tags: []
ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/kai:kai0-gf0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 172800
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_robotwin
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/pi05_robotwin_a3_live_residual_prefix_official_east_${STAMP}.log" 2>&1
  set -x
  echo "=== A3 live residual official East start $(date -u) ==="

  cd "$REPO/kai0"
  PY=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export HF_HOME=$REPO/datasets/.hf_cache
  export HF_DATASETS_CACHE=$HF_HOME/datasets
  export JAX_COMPILATION_CACHE_DIR=$REPO/.cache/jax
  mkdir -p "$HF_DATASETS_CACHE" "$JAX_COMPILATION_CACHE_DIR"

  DATA=$REPO/lmvla/lawam/dataset/robotwin2.0
  INIT=$REPO/kai0/checkpoints/pi05_base/params
  PAIRS=$REPO/lmvla/lmwm/data/robotwin_milestone_balanced/pairs.npz
  FRAME_CACHE=$DATA/frame_cache_jpeg256
  A0_NORM=$REPO/kai0/assets/pi05_robotwin_a0_official_bj/robotwin2.0/norm_stats.json
  A3_NORM_DIR=$REPO/kai0/assets/pi05_robotwin_a3_live_residual_prefix_official_east/robotwin2.0
  test -f "$DATA/meta/info.json"
  test -f "$INIT/_METADATA"
  test -f "$PAIRS"
  test "$(find "$FRAME_CACHE" -path '*/observation.images.cam_high/episode_*.npz' | wc -l)" -eq 27500
  test -f "$A0_NORM"
  mkdir -p "$A3_NORM_DIR"
  cp -f "$A0_NORM" "$A3_NORM_DIR/norm_stats.json"

  EXP="${PI05_EXP_NAME:-pi05_robotwin_a3_live_residual_prefix_official}"
  TRAIN_SEED="${PI05_TRAIN_SEED:-42}"
  CKPT_DIR=$REPO/kai0/checkpoints/pi05_robotwin_a3_live_residual_prefix_official_east/$EXP
  if ls -d "$CKPT_DIR"/[0-9]*/ >/dev/null 2>&1; then
    RESUME_FLAG=--resume
  else
    RESUME_FLAG=--overwrite
  fi
  exec "$PY" -u scripts/train.py pi05_robotwin_a3_live_residual_prefix_official_east \
    --exp-name "$EXP" \
    --seed "$TRAIN_SEED" \
    --num-workers 8 \
    --no-wandb-enabled \
    "$RESUME_FLAG"

RetryOptions:
  EnableRetry: true
  MaxRetryTimes: 2

AccessType: "Public"
