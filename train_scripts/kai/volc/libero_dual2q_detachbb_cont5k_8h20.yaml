# [梯度隔离消融] dual2q + LMWM_MS_DETACH_BACKBONE=1 — 北京 Robot-North-H20 8×H20
#   目的: 测"spatial −3.3 伤害 = 退化 milestone 靶子污染共享 VLM 骨干"假设。
#   与 libero_dual2q_25k_8h20.yaml **唯一差异 = LMWM_MS_DETACH_BACKBONE=1**(单变量 A/B)。
#   预测: 开 detach 后 spatial 回归消失/大减 → 泄漏坐实(结构缺陷可修); 若 long/libero_10 增益
#         同步蒸发 → 增益与伤害同源耦合。纯训练期梯度手术, forward/推理/ckpt 结构不变。
# 依赖(North-E 已就位): libero_rvalley/{pairs,target_compact}.npz + checkpoints/lmwm_libero_rvalley/lmwm.pt
#   + 代码改动(lawam.py 的 _ms_detach_bb, 已 scp 同步到 North-E; 下方 preflight 会核验)。
# 提交: /vePFS-North-E/vis_robot/workspace/deepdive_kai0/kai0/.venv/bin/python submit_yaml.py libero_dual2q_detachbb_25k_8h20.yaml

TaskName: "libero-dual2q-detachbb-cont5k"
Description: "梯度隔离消融: dual2q + ms通道detach骨干, LIBERO 8×H20 25000steps"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.hpcpni3ln.45xlarge"   # 8×H20 整节点

ActiveDeadlineSeconds: 43200   # 12h
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"

Entrypoint: |
  set -uo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_dualarm
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/dual2q_detachbb_cnbj_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== 梯度隔离消融 dual2q+detachbb (cnbj 8×H20) start $(date -u) ==="

  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  cd $REPO/lmvla/lawam

  nvidia-smi -L | head
  $PYTHON -c "from starVLA.model.framework.vlas.lawam import LatentWorldPolicyBackend; print('LatentWorldPolicyBackend import OK')"

  # [防呆] 核验 detach 代码真在 North-E lawam.py(同步失败则大声退出, 防静默跑成无 flag 的普通 dual2q)
  LAW=$REPO/lmvla/lawam/starVLA/model/framework/vlas/lawam.py
  grep -q "_ms_detach_bb" "$LAW" || { echo "FATAL: $LAW 无 _ms_detach_bb — 代码未同步到 North-E, 中止" >&2; exit 17; }
  echo "[preflight] detach 代码已在 North-E lawam.py ✓"

  LMWM=$REPO/lmvla/lmwm
  MS=$LMWM/data/libero_rvalley
  for f in "$LMWM/checkpoints/lmwm_libero_rvalley/lmwm.pt" "$MS/pairs.npz" "$MS/target_compact.npz"; do
    [ -f "$f" ] || { echo "FATAL: $f missing" >&2; exit 13; }
  done
  echo "[$(date)] preflight OK (dual2q detachbb, rvalley pairs)"

  export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  export MASTER_PORT=29523
  export LMWM_CKPT=$LMWM/checkpoints/lmwm_libero_rvalley/lmwm.pt
  export LMWM_MILESTONE_TARGET=$MS/pairs.npz
  export LMWM_TARGET_COMPACT=$MS/target_compact.npz
  export LMWM_ADAPTER_DIR=$REPO/lmvla/lawam
  export LMWM_SWAP_TEACHER=1
  export LMWM_HINT_DROPOUT=0.15
  export LMWM_DUAL=1
  export LMWM_DUAL_2Q=1                   # 双 query 基座(局部/全局各一组 act placeholder)
  export LMWM_MS_DETACH_BACKBONE=1        # ★ 唯一变量: ms 通道梯度不回流共享 VLM
  export LAWAM_RUN_TIMESTAMP=${STAMP}

  bash train_lawam_distributed.sh \
    --config_yaml starVLA/config/training/train_libero.yaml \
    --run_id=dual2q_detachbb_cont5k --trainer.pretrained_checkpoint=/vePFS-North-E/vis_robot/workspace/deepdive_kai0/lmvla/lawam/results/Checkpoints/libero/20260726_004801+dual2q_detachbb_25k/checkpoints/steps_20000_pytorch_model.pt \
    --trainer.max_train_steps=5000 \
    --trainer.save_interval=2500  # warm-start@20k, 续到25k-equiv(new steps_5000)

  echo "=== 梯度隔离消融 dual2q+detachbb (cnbj) DONE $(date -u) ==="

RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0

AccessType: "Public"
