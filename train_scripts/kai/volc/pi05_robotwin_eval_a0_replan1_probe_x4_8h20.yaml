TaskName: "pi05-robotwin-a0-replan1-probe-x4"
Description: "A0 RoboTwin openpi bridge probe: replan every high-level qpos step, 6 tasks x 10 trials x 4 seeds"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 43200
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/pi05_rteval_a0_replan1_probe_x4_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== pi05_robotwin_a0 openpi eval: replan1 probe x4 start $(date -u) ==="

  mkdir -p /home/tim/workspace && ln -sfn $REPO /home/tim/workspace/deepdive_kai0

  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  cd $REPO/lmvla/lawam

  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG=pi05_robotwin_a0_bj
  export OPENPI_SERVE_SCRIPT=$REPO/kai0/scripts/serve_policy.py
  export KAI0_ROOT=$REPO/kai0
  export ROBOTWIN_MODEL_INTERFACE=openpi

  CKPT="${CKPT:-$REPO/kai0/checkpoints/pi05_robotwin_a0_bj/pi05_robotwin_a0/29999}"
  [ -d "$CKPT/params" ] || { echo "FATAL: openpi ckpt missing params/: $CKPT" >&2; exit 13; }
  [ -f "$CKPT/assets/robotwin2.0/norm_stats.json" ] || { echo "FATAL: ckpt missing assets/robotwin2.0/norm_stats.json: $CKPT" >&2; exit 13; }
  echo "[$(date)] CKPT=$CKPT"

  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  [ -d "$ROBOTWIN_PATH/envs" ] || { echo "FATAL: RoboTwin missing $ROBOTWIN_PATH" >&2; exit 13; }
  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  [ -x "$ROBOTWIN_PYTHON" ] || { echo "FATAL: wrapper not executable $ROBOTWIN_PYTHON" >&2; exit 13; }
  "$ROBOTWIN_PYTHON" -c "import sapien, mplib" 2>/dev/null || { echo "FATAL: wrapper missing sapien/mplib" >&2; exit 13; }

  export PYTHONPATH="$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  "$ROBOTWIN_PYTHON" -c "import openpi_client.websocket_client_policy" 2>/dev/null \
    || { echo "[selfheal] installing websockets/msgpack"; "$ROBOTWIN_PYTHON" -m pip install -q websockets msgpack 2>&1 | tail -2 || true; }
  "$ROBOTWIN_PYTHON" -c "import openpi_client.websocket_client_policy" 2>/dev/null \
    || { echo "FATAL: wrapper cannot import openpi_client" >&2; exit 13; }

  export ROBOTWIN_TASKS="beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three"
  for t in $ROBOTWIN_TASKS; do
    [ -f "$ROBOTWIN_PATH/envs/$t.py" ] || { echo "FATAL: missing task $t" >&2; exit 13; }
  done
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM=10
  export ROBOTWIN_NUM_SLOTS=1
  export NUM_WORKERS=1
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=1
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST="9.0"

  nvidia-smi -L | head -8
  echo "[$(date)] preflight OK; tasks=$ROBOTWIN_TASKS"

  NREP=4
  pids=""
  for i in $(seq 0 $((NREP-1))); do
    (
      export CUDA_VISIBLE_DEVICES=$i
      export SEED=$i
      export PORT_BASE=$((7100 + i*40))
      export ROBOTWIN_EVAL_ROOT=$REPO/lmvla/lawam/results/eval_runs/robotwin/pi05_rt_a0_replan1_probe/seed$i
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      echo "[a0-replan1 seed$i] GPU=$i start $(date -u)"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh "$CKPT" "$TASK_CONFIG" "seed$i"
      echo "[a0-replan1 seed$i] done rc=$? $(date -u)"
    ) > "$LOG_DIR/pi05_rteval_a0_replan1_probe_x4_${STAMP}_seed${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 25
  done
  echo "[$(date)] launched $NREP replicas: $pids"
  for p in $pids; do wait $p; done
  echo "[$(date)] all replicas done"

  $PYTHON - <<'PYEOF'
  import json, glob, os, statistics as st
  base = f"{os.environ['REPO']}/lmvla/lawam/results/eval_runs/robotwin/pi05_rt_a0_replan1_probe"
  out = {}
  for f in sorted(glob.glob(f"{base}/seed*/**/*.json", recursive=True)):
      try:
          d = json.load(open(f))
      except Exception:
          continue
      if not isinstance(d, dict) or "success_rate" not in d:
          continue
      sd = f.split("/seed")[1].split("/")[0]
      out.setdefault(sd, {})[d.get("task_name", "?")] = float(d["success_rate"])
  print("\n===== pi05_robotwin_a0 replan1 probe: 6 tasks x 4 seeds =====")
  if not out:
      print("No summary.json parsed; inspect results/eval_runs/robotwin/pi05_rt_a0_replan1_probe/")
  tasks = sorted({t for v in out.values() for t in v})
  for sd in sorted(out):
      print(f"  seed{sd}: " + " ".join(f"{t}={out[sd].get(t,float('nan')):.2f}" for t in tasks))
  for t in tasks:
      vs = [out[s][t] for s in out if t in out[s]]
      if vs:
          print(f"    {t:24s} mean={st.mean(vs):6.3f} n={len(vs)}")
  allv = [out[s][t] for s in out for t in out[s]]
  if allv:
      print(f"  aggregate_SR={st.mean(allv):.3f} (n={len(allv)})")
  print("=============================================================\n")
  PYEOF

  echo "=== pi05_robotwin_a0 openpi eval replan1 probe DONE $(date -u) ==="

RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0

AccessType: "Public"
