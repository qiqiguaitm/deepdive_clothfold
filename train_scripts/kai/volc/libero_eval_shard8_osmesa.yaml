# 【多卡并行推理提速】LIBERO-10 单seed 10task 分片到 8 卡 — 北京 8×H20 整节点
#
# 动机(2026-07-24): 单卡 eval 瓶颈=单 server 单卡推理(osmesa 只 2×)。真正提速=把 10 个 task 分到 8 张卡,
#   每卡独立 server 只跑自己那 1-2 个 task → 8 卡并行推理 → 一个完整 10-task 结果 ~16min(vs 单卡 osmesa ~56min / egl ~106min)。
#   机制: _task_id_list 已有的 EVAL_ONLY_TASKS env 门(串行+并行两条路都认), 每卡设不同 task 子集, 无需改代码。
#   代价: 单 seed 无误差棒(要误差棒跑多轮不同 seed); 本任务定位=快速方向读数 + 顺带核对 osmesa 口径。
#
# 分片: 10 task / 8 卡 round-robin → GPU0={0,8} GPU1={1,9} GPU2={2}...GPU7={7}(慢卡=带2个task的0/1)。
# 用残差 ckpt 跑 → 与正在跑的 egl 8-seed 判定(b3zmbge2z)交叉验证。

TaskName: "lmwm-eval-shard8-osmesa"
Description: "10task分8卡并行推理(osmesa), 单seed完整结果~16min, 多卡提速验证"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Preemptible: false
Framework: "PyTorch"

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.hpcpni3ln.45xlarge"   # 8×H20 整节点

ActiveDeadlineSeconds: 7200   # 2h 余量(预期 ~16min 完)
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_eval
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/evalshard8_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== 10task分8卡并行推理 start $(date -u) ==="

  CKPT=$(ls -t $REPO/lmvla/lawam/results/Checkpoints/libero/*resid_cnbj*/checkpoints/steps_12500_pytorch_model.pt 2>/dev/null | head -1)
  export RUN_GROUP=resid_shard8

  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  export LIBERO_PYTHON=$PYTHON
  cd $REPO/lmvla/lawam

  nvidia-smi -L | head -8
  [ -f "$CKPT" ] || { echo "FATAL: ckpt 不存在 $CKPT" >&2; exit 13; }

  env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
    $PYTHON -m pip install -q -i https://mirrors.aliyun.com/pypi/simple/ \
    'robosuite==1.4.1' mujoco opencv-python-headless tyro websockets json-numpy 2>&1 | tail -2
  LH=$REPO/lmvla/LIBERO
  mkdir -p "$LH/libero"
  {
    echo "benchmark_root: $LH/libero/libero"
    echo "bddl_files: $LH/libero/libero/bddl_files"
    echo "init_states: $LH/libero/libero/init_files"
    echo "datasets: $LH/libero/libero/../datasets"
    echo "assets: $LH/libero/libero/assets"
  } > "$LH/libero/config.yaml"
  rm -f /root/.libero/config.yaml 2>/dev/null || true
  $PYTHON -c "from starVLA.model.framework.vlas.lawam import LatentWorldPolicyBackend; print('Backend OK')"

  # LMWM 注入(与残差 ckpt 架构一致)
  export LMWM_CKPT=$REPO/lmvla/lmwm/checkpoints/lmwm_libero_rvalley/lmwm.pt
  export LMWM_ADAPTER_DIR=$REPO/lmvla/lmwam/adapter
  export LMWM_SWAP_TEACHER=1
  export LMWM_DUAL=1
  export LMWM_DUAL_2Q=1
  unset LMWM_MILESTONE_TARGET LMWM_TARGET_COMPACT LMWM_MS_TSCHED LMWM_HINT_DROPOUT
  [ -f "$LMWM_CKPT" ] || { echo "FATAL: LMWM ckpt 不存在 $LMWM_CKPT" >&2; exit 13; }

  export SUITES=libero_10
  export NUM_TRIALS_PER_TASK=50
  export NUM_WORKERS=25
  export MUJOCO_GL=osmesa            # CPU 渲染, 多 worker 安全
  export SERVER_STARTUP_TIMEOUT_SEC=1200
  export OUTPUT_ROOT=$REPO/lmvla/lawam/results/eval_runs/libero
  export EVAL_SEED=0                 # 单 seed(方向读数; 误差棒靠多轮)

  echo "[$(date)] preflight OK; ckpt=$CKPT group=$RUN_GROUP 分片=8卡round-robin"

  # ---- 8 卡分片: 每卡独立 server, 只跑自己那 1-2 个 task ----
  pids=""
  for i in $(seq 0 7); do
    # round-robin: GPU i 跑 task i 和 i+8(若存在)
    IDS="$i"
    [ $((i+8)) -lt 10 ] && IDS="$i,$((i+8))"
    (
      export GPU_IDS=$i
      export EVAL_GPU_IDS=$i
      export PORT_BASE=$((5694 + i*20))
      export EVAL_ONLY_TASKS=$IDS       # ★ 关键: 本卡只跑这些 task
      export LIBERO_RUN_GROUP=$RUN_GROUP
      export RUN_TAG=shard$i
      echo "[shard$i] GPU=$i tasks={$IDS} 启动 $(date -u)"
      T0=$(date +%s)
      bash examples/LIBERO/eval_files/auto_eval_scripts/run_libero_benchmark.sh "$CKPT"
      echo "[shard$i] tasks={$IDS} 结束 rc=$? 耗时 $(( ($(date +%s)-T0)/60 ))min $(date -u)"
    ) > "$LOG_DIR/evalshard8_${STAMP}_shard${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 15
  done
  echo "[$(date)] 已起 8 分片: $pids"
  for p in $pids; do wait $p; done
  echo "[$(date)] 全部分片结束"

  # ---- 汇总: concat 8 分片的 episodes.jsonl = 完整 10-task 单seed 结果 ----
  $PYTHON - <<'PYEOF'
  import json, glob, os
  from collections import defaultdict
  root = os.environ.get("OUTPUT_ROOT"); group = os.environ.get("RUN_GROUP")
  per = defaultdict(list)
  files = sorted(glob.glob(f"{root}/{group}/shard*/suites/libero_10/episodes.jsonl"))
  for f in files:
      for line in open(f):
          d = json.loads(line); per[int(d["task_id"])].append(bool(d["success"]))
  print("\n============ 分片合并: 单seed 完整 10-task ============")
  tot = sum(len(v) for v in per.values()); ns = sum(sum(v) for v in per.values())
  for k in sorted(per):
      v = per[k]; print(f"  t{k}: {sum(v)/len(v)*100:5.1f}  (n={len(v)})")
  if tot:
      print(f"\n聚合: {ns/tot*100:.2f}  (n={tot}, 覆盖 {len(per)}/10 task)")
  print("对比基座 2q_tsched(egl 8seed): agg=95.22 t8=90.0 t6=85.0")
  print("=====================================================\n")
  PYEOF

  echo "=== 10task分8卡并行推理 DONE $(date -u) ==="

RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0

AccessType: "Public"
