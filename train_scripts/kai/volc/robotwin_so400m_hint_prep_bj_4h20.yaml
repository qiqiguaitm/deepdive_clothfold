# RoboTwin A2 upstream: So400m grid -> LMWM robotwin_so400m -> absolute/residual pi05 hints.

TaskName: "robotwin-so400m-hint-prep-bj"
Description: "RoboTwin A2 prep: extract So400m grid, train LMWM, export absolute+residual pi05 hints"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 259200
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"

Entrypoint: |
  set -uo pipefail
  export RT_REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  export REPO=$RT_REPO
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lmwm/logs
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/robotwin_so400m_hint_prep_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== robotwin_so400m_hint_prep start $(date -u) ==="
  nvidia-smi -L

  PY=$REPO/kai0/.venv/bin/python
  SC=$REPO/lmvla/lmwm/scripts
  EPS=$REPO/lmvla/lmwm/data/full_alleps.txt
  GRID=$REPO/lmvla/lmwm/data/robotwin_so400m_grid
  FEATROOT=$REPO/lmvla/lmwm/data/robotwin_so400m_feat_pi05
  CKPT=$REPO/lmvla/lmwm/checkpoints/lmwm_robotwin_so400m
  ABS_HINT_DIR=$REPO/lmvla/lmwm/data/pi05_hint/robotwin_so400m
  RES_HINT_DIR=$REPO/lmvla/lmwm/data/pi05_hint/robotwin_so400m_residual
  PAIRS=$REPO/lmvla/lmwm/data/robotwin_milestone_balanced/pairs.npz

  [ -f "$EPS" ] || { echo "FATAL: eps file missing $EPS" >&2; exit 13; }
  [ -f "$PAIRS" ] || { echo "FATAL: balanced pairs missing $PAIRS" >&2; exit 13; }
  [ -d "$REPO/lmvla/lmwm/data/hf_so400m" ] || { echo "FATAL: hf_so400m missing" >&2; exit 13; }
  [ -d "$REPO/lmvla/lawam/dataset/robotwin2.0/frame_cache_jpeg256" ] || { echo "FATAL: robotwin frame cache missing" >&2; exit 13; }
  $PY -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'ndev', torch.cuda.device_count())"

  echo "=== Stage1 So400m grid extract 4 shards $(date -u) ==="
  pids=""
  for g in 0 1 2 3; do
    CUDA_VISIBLE_DEVICES=$g $PY "$SC/robotwin_so400m_grid_extract.py" \
      --eps-file "$EPS" --shard $g --nshard 4 --out "$GRID" \
      > "$LOG_DIR/robotwin_so400m_grid_g${g}_${STAMP}.log" 2>&1 &
    pids="$pids $!"
  done
  for p in $pids; do wait $p; done
  NG=$(find "$GRID" -maxdepth 1 -name 'ep*.npz' 2>/dev/null | wc -l)
  echo "[grid] ep count=$NG"
  [ "$NG" -ge 27000 ] || { echo "FATAL: So400m grid incomplete ($NG<27000)" >&2; exit 14; }

  echo "=== Stage2 train RoboTwin So400m LMWM $(date -u) ==="
  CUDA_VISIBLE_DEVICES=0 $PY "$SC/p1_train_lmwm_robotwin.py" \
    --feat "$GRID" \
    --pairs "$PAIRS" \
    --out "$CKPT" \
    --steps 5000 \
    --bs 48 \
    --cache_cap 200
  [ -f "$CKPT/lmwm.pt" ] || { echo "FATAL: LMWM ckpt missing $CKPT/lmwm.pt" >&2; exit 15; }

  echo "=== Stage3 export absolute + residual pi05 hints $(date -u) ==="
  mkdir -p "$FEATROOT"
  ln -sfn "$GRID" "$FEATROOT/robotwin"
  CUDA_VISIBLE_DEVICES=0 $PY "$SC/export_pi05_hint.py" \
    --ckpt "$CKPT/lmwm.pt" \
    --feat-root "$FEATROOT" \
    --out "$ABS_HINT_DIR" \
    --K 1 \
    --batch 128
  [ -f "$ABS_HINT_DIR/hint.npz" ] || { echo "FATAL: absolute hint missing" >&2; exit 16; }
  $PY "$SC/make_pi05_residual_hint.py" \
    --hint "$ABS_HINT_DIR/hint.npz" \
    --feat-root "$FEATROOT" \
    --out "$RES_HINT_DIR"
  [ -f "$RES_HINT_DIR/hint.npz" ] || { echo "FATAL: residual hint missing" >&2; exit 17; }
  ls -lh "$ABS_HINT_DIR/hint.npz" "$RES_HINT_DIR/hint.npz"
  echo "=== robotwin_so400m_hint_prep DONE $(date -u) ==="

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
