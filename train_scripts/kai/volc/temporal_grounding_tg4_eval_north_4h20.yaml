TaskName: "temporal-grounding-tg4-eval-north4g"
Description: "Frozen TG4 source-decomposition fixed-scene evaluation on North"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 129600
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: TG4_ARM
    Value: "full"
  - Name: TG4_TRAIN_SEED
    Value: "1100"
  - Name: TG4_CONDITION
    Value: "normal"

Entrypoint: |
  set -Eeuo pipefail
  NORTH_REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  REPO=$NORTH_REPO/.staging/temporal_grounding_tg4_eval_v1/repo
  TRAIN_STAGE=$NORTH_REPO/.staging/temporal_grounding_11fb843
  RUN_ID=temporal_grounding_tg4_${TG4_ARM}_seed${TG4_TRAIN_SEED}
  case "$TG4_ARM" in
    clean_base|future_off|auxiliary_only|conditioning_only|parameter_matched_null|full) ;;
    *) echo "unsupported TG4_ARM=$TG4_ARM" >&2; exit 2 ;;
  esac
  test "$TG4_CONDITION" = normal

  export TG4_CONTROL_PYTHON=$TRAIN_STAGE/kai0/.venv/bin/python
  export STAR_VLA_PYTHON=$TG4_CONTROL_PYTHON
  export TG4_CHECKPOINT_ROOT=$REPO/lmvla/lawam_local/results/Checkpoints/robotwin
  export TG4_RESULT_BASE=$REPO/lmvla/lawam_local/results/eval_runs/robotwin
  export TG4_FEATURE_BASE=$REPO/logs/temporal_grounding/tg4/features
  export TG4_MARKER_ROOT=$REPO/logs/resource_markers
  export TG4_LOG_DIR=$REPO/logs/temporal_grounding/tg4/eval
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/train_scripts/kai/eval/robotwin_python_wrapper_north.sh
  export PYTHONPATH=/vePFS-North-E/vis_robot/workspace/tim/runtime/tg2_transformers_5_2_py312_padding_v3:${PYTHONPATH:-}
  export TORCH_CUDA_ARCH_LIST=9.0
  export TORCH_EXTENSIONS_DIR=/vePFS-North-E/vis_robot/tim/runtime/torch_extensions/h20_sm90_py310
  export LOCAL_GPU_COUNT=4

  STAGE_MARKER=$REPO/logs/resource_markers/temporal_grounding_tg4_eval_north_stage.ok
  INTEGRITY=$REPO/logs/resource_markers/temporal_grounding_tg4_training_integrity.ok
  REMOTE_MARKER=$REPO/logs/resource_markers/${RUN_ID}_normal_eval.ok
  RESULT_ROOT=$TG4_RESULT_BASE/${RUN_ID}_normal
  LOG_DIR=$REPO/logs/temporal_grounding/tg4/eval_entrypoint
  mkdir -p "$LOG_DIR" "$TORCH_EXTENSIONS_DIR"
  exec > >(tee -a "$LOG_DIR/${TG4_ARM}_s${TG4_TRAIN_SEED}_normal_$(date -u +%Y%m%d_%H%M%S).log") 2>&1

  test -s "$STAGE_MARKER"
  test -s "$INTEGRITY"
  test -x "$TG4_CONTROL_PYTHON"
  test -x "$ROBOTWIN_PYTHON"
  test -d "$ROBOTWIN_PATH/envs"
  test -s "$TG4_CHECKPOINT_ROOT"/*+"$RUN_ID"/final_model/pytorch_model.pt
  "$ROBOTWIN_PYTHON" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'

  REPO_ROOT="$REPO" bash "$REPO/train_scripts/kai/eval/run_temporal_grounding_tg4_eval.sh"
  "$TG4_CONTROL_PYTHON" "$REPO/lmvla/lmwm/scripts/verify_robotwin_fixed_seed_eval.py" \
    --manifest "$REPO/lmvla/lmwm/data/robotwin_pi05_confirmatory_scene_seeds_v1.json" \
    --root "$RESULT_ROOT"
  test "$(find "$RESULT_ROOT" -type f -name summary.json | wc -l)" -eq 24
  printf 'validated=%s\nrun_id=%s\ncondition=normal\nresult_root=%s\n' \
    "$(date -u +%FT%TZ)" "$RUN_ID" "$RESULT_ROOT" > "$REMOTE_MARKER"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
