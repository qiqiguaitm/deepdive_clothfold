# pi05 单臂单套件 eval — 北京 Robot-North-H20 单卡(North-E 文件系统). __占位__ 生成器替换.
TaskName: "pi05-ev-A2-libero_goal-bj1g"
Description: "pi05 A2 libero_goal n=3 重评, 北京North-H20 单卡"
Tags: []
ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.5xlarge"
ActiveDeadlineSeconds: 43200
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"
CacheType: "Cloudfs"
Envs:
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"
Entrypoint: |
  set -uo pipefail
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  # 跨集群路径垫片: config 里 datasets_yaml 等硬编码 gf0 路径 → 软链到 North-E repo(/vePFS 在北京容器非挂载, 临时根可建)
  mkdir -p /vePFS/tim/workspace 2>/dev/null && ln -sfn "$REPO" /vePFS/tim/workspace/deepdive_kai0 2>/dev/null || echo "shim-be"
  LOG_DIR=$REPO/lmvla/lmwm/logs; mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/pi05ev_bj_A2_libero_goal_${STAMP}.log" 2>&1
  set -x
  echo "=== pi05 A2 libero_goal n=3 start $(date -u) (北京) ==="
  nvidia-smi -L | head
  cd "$REPO/kai0"; source .venv/bin/activate
  apt-get update 2>&1|tail -1; apt-get install -y libosmesa6 libosmesa6-dev 2>&1|tail -1 || echo osmesa-be
  export LIBERO_HOME=$REPO/lmvla/LIBERO
  export LIBERO_CONFIG_PATH=$LIBERO_HOME/libero
  export PYTHONPATH="$REPO/kai0/src:$REPO/lmvla/lawam:$LIBERO_HOME"
  export MUJOCO_GL=osmesa PYTHONUNBUFFERED=1
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.75 XLA_PYTHON_CLIENT_PREALLOCATE=false
  HINT_PY=$REPO/lmvla/lawam/examples/LIBERO/eval_files/local_eval_hint.py
  for SEED in 0 1 2; do
    OUT=$REPO/lmvla/lmwm/data/pi05_libero_eval/suiteev_A2_-libero_goal-s${SEED}_${STAMP}
    python "$HINT_PY" --config "pi05_libero_a2_prefix_eval" --ckpt "/vePFS-North-E/vis_robot/workspace/deepdive_kai0/kai0/checkpoints/pi05_libero_a2_prefix_bj/pi05_libero_a2_prefix/29999" --encoder "so400m" \
      --suite "libero_goal" --tasks -1 --trials 10 --seed $SEED --replan 5 --out "$OUT"
    echo "[A2 libero_goal s$SEED] done rc=$?"
  done
  echo "=== A2 libero_goal ALL DONE $(date -u) ==="
RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0
AccessType: "Public"
