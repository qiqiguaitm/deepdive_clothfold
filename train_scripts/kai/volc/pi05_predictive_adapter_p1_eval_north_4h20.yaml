TaskName: "pi05-predictive-adapter-p1-eval-north4g"
Description: "Frozen 24-cell predictive-adapter P1 causal evaluation on North H20"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 172800
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  VERIFY_REPO=$REPO/logs/frozen_source_overlays/pi05_r1_v1
  STAMP=$(date -u +%Y%m%d_%H%M%SZ)
  LOG_DIR=$REPO/logs/predictive/p1_platform_north
  mkdir -p "$LOG_DIR"
  exec >>"$LOG_DIR/${PREDICTIVE_P1_CONDITION:?missing condition}_${STAMP}.log" 2>&1
  set -x

  export REPO
  export P1_VERIFY_REPO="$VERIFY_REPO"
  export P1_PROTOCOL_OUTPUT_DIR="$REPO/logs/p1_runtime_north"
  export OPENPI_DATA_HOME="$REPO/openpi_cache"
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON="$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh"
  export PYTHONPATH="$VERIFY_REPO/kai0/src:$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  export TORCH_CUDA_ARCH_LIST=9.0
  export TORCH_EXTENSIONS_DIR=/vePFS-North-E/vis_robot/tim/runtime/torch_extensions/h20_sm90_py310
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.22
  mkdir -p "$TORCH_EXTENSIONS_DIR" /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0

  test -s "$REPO/logs/resource_markers/pi05_p1_north_eval_stage.ok"
  test -s "$VERIFY_REPO/READY"
  test -x "$ROBOTWIN_PYTHON"
  test -f "${CKPT:?missing CKPT}/params/_METADATA"
  test -f "$CKPT/assets/robotwin2.0_absolute_meanstd/norm_stats.json"
  "$REPO/kai0/.venv/bin/python" - <<'PY'
  import pathlib
  import openpi

  expected = pathlib.Path(
      "/vePFS-North-E/vis_robot/workspace/deepdive_kai0/"
      "logs/frozen_source_overlays/pi05_r1_v1/kai0/src/openpi"
  ).resolve()
  actual = pathlib.Path(openpi.__file__).resolve()
  if expected not in actual.parents:
      raise SystemExit(f"frozen openpi overlay not active: {actual}")
  print(f"frozen_openpi={actual}")
  PY

  exec env LOCAL_GPU_COUNT=4 MAX_PARALLEL_SEEDS=4 GPU_INDEX_OFFSET=0 \
    bash "$REPO/train_scripts/kai/eval/run_pi05_predictive_adapter_p1_frozen.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
