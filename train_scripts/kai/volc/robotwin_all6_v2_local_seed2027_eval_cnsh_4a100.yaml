TaskName: "robotwin-all6-v2-local-s2027-eval-cnsh4g"
Description: "RoboTwin all6 v2 local-WM seed2027, six tasks x50 episodes x4 eval seeds"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.14xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LAWAM=$REPO/lmvla/lawam
  RUN=$LAWAM/results/Checkpoints/robotwin/20260730_234942+robotwin_all6_v2_local_seed2027
  CKPT=$RUN/final_model/pytorch_model.pt
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$LAWAM/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/all6_v2_local_seed2027_eval_cnsh4g_${STAMP}.log" 2>&1
  set -x

  test -f "$CKPT"
  test -f "$RUN/config.yaml"
  test -f "$RUN/dataset_statistics.json"
  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"

  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"

  export STAR_VLA_PYTHON=$REPO/kai0/.venv/bin/python
  export ROBOTWIN_PATH=/vePFS/HuanQian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh
  export ROBOTWIN_TASKS="beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three"
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM=50
  export ROBOTWIN_NUM_SLOTS=1
  export NUM_WORKERS=1
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_INSTRUCTION_TYPE=unseen
  export PORT_SEARCH_LIMIT=30
  export TORCH_CUDA_ARCH_LIST=8.0

  unset LMWM_CKPT LMWM_ADAPTER_DIR LMWM_SWAP_TEACHER LMWM_FEAT_STRIDE
  unset LMWM_HINT_DROPOUT LMWM_DUAL LMWM_DUAL_2Q LMWM_MS_TSCHED
  unset LMWM_MS_RESIDUAL LMWM_MS_RESID_SCALE LMWM_MS_ABS_SCALE
  unset LMWM_MS_GATE LMWM_MS_DETACH_BACKBONE LMWM_LOCAL_DETACH_BACKBONE

  "$ROBOTWIN_PYTHON" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'

  cd "$LAWAM"
  nvidia-smi -L
  pids=""
  for seed in 0 1 2 3; do
    (
      export CUDA_VISIBLE_DEVICES=$seed
      export GPU_IDS=$seed
      export SEED=$seed
      export PORT_BASE=$((12000 + seed * 40))
      export ROBOTWIN_CKPT_ALIAS=robotwin_all6_v2_local_seed2027
      export ROBOTWIN_EVAL_ROOT=$LAWAM/results/eval_runs/robotwin/rt_all6_v2_local_seed2027_unseen/seed$seed
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh \
        "$CKPT" "$TASK_CONFIG" "eval-seed$seed"
    ) > "$LOG_DIR/all6_v2_local_seed2027_eval_cnsh4g_${STAMP}_seed${seed}.log" 2>&1 &
    pids="$pids $!"
    sleep 20
  done

  status=0
  for pid in $pids; do
    wait "$pid" || status=1
  done
  echo "all6 v2 local seed2027 eval finished status=$status $(date -u)"
  exit "$status"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
