TaskName: "pi05-r1-eval-cnsh4g"
Description: "Frozen same-scene recurrence-aligned pi0.5 R1 evaluation"
Tags: []
ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.14xlarge"
ActiveDeadlineSeconds: 172800
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%SZ)
  mkdir -p "$REPO/logs/r1/platform"
  exec >>"$REPO/logs/r1/platform/${R1_CONDITION:?missing R1_CONDITION}_${STAMP}_eval_cnsh.log" 2>&1
  set -x
  exec env REPO="$REPO" LOCAL_GPU_COUNT=4 MAX_PARALLEL_SEEDS=4 \
    bash "$REPO/train_scripts/kai/eval/run_pi05_r1_formal.sh"
RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
