TaskName: "robotwin-all6-v2-nocacheprobe-bj1g"
Description: "Exact all6 v2 120-step baseline throughput probe with source-video decoding"
Tags: []
ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.5xlarge"

ActiveDeadlineSeconds: 14400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_robotwin
  mkdir -p "$LOG_DIR" /home/tim/workspace
  exec >> "$LOG_DIR/all6_v2_nocacheprobe_${STAMP}.log" 2>&1
  set -x
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  cd "$REPO/lmvla/lawam"
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export LAWAM_RUN_TIMESTAMP="$STAMP"

  bash train_lawam_distributed.sh \
    --config_yaml starVLA/config/training/train_robotwin.yaml \
    --run_id=robotwin_all6_v2_nocacheprobe_seed2026 \
    --seed=2026 \
    --datasets.vla_data.data_mix=robotwin2_lmwm_all6_v2 \
    --datasets.vla_data.enable_video_frame_cache=false \
    --trainer.max_train_steps=120 \
    --trainer.save_interval=1000

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
