TaskName: "robotwin-all6-v2-b32a1-probe-bj8g"
Description: "all6 v2 local arm 120-step throughput probe: 8xH20, batch32/rank, accumulation1, global batch256"
Tags: []
ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.hpcpni3ln.45xlarge"
ActiveDeadlineSeconds: 14400
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    MountPath: "/vePFS-North-E/vis_robot"
    SubPath: "/vis_robot"
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OMP_NUM_THREADS
    Value: "8"
  - Name: ROBOTWIN_ALL6_REPO
    Value: "/vePFS-North-E/vis_robot/workspace/deepdive_kai0"
  - Name: ROBOTWIN_ALL6_VARIANT
    Value: "local"
  - Name: ROBOTWIN_ALL6_SEED
    Value: "2026"
  - Name: ROBOTWIN_ALL6_MAX_STEPS
    Value: "120"
  - Name: ROBOTWIN_ALL6_SAVE_INTERVAL
    Value: "1000"
  - Name: ROBOTWIN_ALL6_PER_DEVICE_BATCH_SIZE
    Value: "32"
  - Name: ROBOTWIN_ALL6_GRADIENT_ACCUMULATION_STEPS
    Value: "1"
  - Name: ROBOTWIN_ALL6_FUSED_ADAMW
    Value: "false"
  - Name: ROBOTWIN_ALL6_AUTO_RESUME
    Value: "false"
Entrypoint: |
  set -euo pipefail
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$ROBOTWIN_ALL6_REPO/lmvla/lawam/logs/volc_robotwin
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/all6_v2_b32a1_probe_${STAMP}.log" 2>&1
  set -x
  nvidia-smi -L
  bash "$ROBOTWIN_ALL6_REPO/train_scripts/kai/volc/run_robotwin_all6_v2_train.sh"
RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
