# [pi05×RoboTwin eval 桥] pi05_robotwin_a0 (openpi, 无 hint) 积木族 6 任务 eval, 4 变 seed 并行
#
# 通路: auto_eval_robotwin.sh → batched_eval_runner.py(ROBOTWIN_SERVER_BACKEND=openpi → 起 openpi
#   serve_policy.py; ckpt=checkpoint 目录) → robotwin_batch_bridge.py(ROBOTWIN_MODEL_INTERFACE=openpi
#   → model2robotwin_openpi.OpenpiRobotwinModelClient, self.client=openpi WebsocketClientPolicy)。
#   env 循环(slot/Pipe/SR/summary.json)与 starVLA 版逐字节一致, 仅 server 命令 + model client 换掉。
#
# ⚠️ 归一化: openpi server 端已在内部做 Normalize + AlohaOutputs(adapt_to_pi) 反归一化, 返回真实
#   14 维 joint 动作; openpi ModelClient **不再 unnormalize**(双反=错, 已在本机协议 smoke 证实动作
#   落在合理 rad 区间)。env_action_type=qpos。
#
# ★ seed 逐路不同 ★ batched_eval_runner.py `SEED=os.getenv("SEED","0")` 默认 0 陷阱, 每路 SEED=$i。
#
# 口径: 6 积木任务 × ROBOTWIN_TEST_NUM 局/路 × 4 路(seed 0..3), GPU 0..3。GPU 4..7 留给 a1
#   (在线 hint, 待 #39 a1 ckpt 训完后用 pi05_robotwin_eval_a1_x4_8h20.yaml)。

TaskName: "pi05-robotwin-eval-a1-x4"
Description: "pi05_robotwin_a0(openpi,无hint) 积木6任务 eval, 4变seed, openpi server桥"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"   # 4卡: 匹配NREP=4, 好调度   # 8×H20 整节点(该队列无 4 卡规格)

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/pi05_rteval_a0_x4_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== pi05_robotwin_a0 openpi eval: a1×4seed start $(date -u) ==="

  mkdir -p /home/tim/workspace && ln -sfn $REPO /home/tim/workspace/deepdive_kai0

  # ---- openpi server 侧解释器 = kai0/.venv (含 openpi+jax); batched_eval_runner 用 STAR_VLA_PYTHON 起 server ----
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  cd $REPO/lmvla/lawam

  # ---- openpi server backend 开关 ----
  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG=pi05_robotwin_a1_prefix_bj  # server 端 config (repack 推理不用, 只取 model+transform+norm)
  export ROBOTWIN_HINT_ENCODER=dinov3-base   # a1 在线hint(hint_online_robotwin)
  export OPENPI_SERVE_SCRIPT=$REPO/kai0/scripts/serve_policy.py
  export KAI0_ROOT=$REPO/kai0
  export ROBOTWIN_MODEL_INTERFACE=openpi                 # bridge → model2robotwin_openpi

  # ---- 待评 ckpt = openpi checkpoint 目录 (含 params/ + assets/robotwin2.0/norm_stats.json) ----
  #   a0 训练输出: checkpoints/pi05_robotwin_a0_bj/pi05_robotwin_a0/<step>/  (可用 env CKPT 覆盖)
  CKPT="${CKPT:-$REPO/kai0/checkpoints/pi05_robotwin_a1_prefix_bj/pi05_robotwin_a1_prefix/29999}"
  [ -d "$CKPT/params" ] || { echo "FATAL: openpi ckpt 缺 params/: $CKPT" >&2; exit 13; }
  [ -f "$CKPT/assets/robotwin2.0/norm_stats.json" ] || { echo "FATAL: ckpt 缺 assets/robotwin2.0/norm_stats.json: $CKPT" >&2; exit 13; }
  echo "[$(date)] CKPT=$CKPT"

  # ---- RoboTwin 仿真侧: 独立解释器 wrapper (sapien/mplib/curobo, 不在 kai0 venv) ----
  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  [ -d "$ROBOTWIN_PATH/envs" ] || { echo "FATAL: RoboTwin 不存在 $ROBOTWIN_PATH" >&2; exit 13; }
  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  [ -x "$ROBOTWIN_PYTHON" ] || { echo "FATAL: wrapper 不可执行 $ROBOTWIN_PYTHON" >&2; exit 13; }
  "$ROBOTWIN_PYTHON" -c "import sapien, mplib" 2>/dev/null || { echo "FATAL: wrapper 缺 sapien/mplib" >&2; exit 13; }

  # ---- bridge(跑在 wrapper env)需 openpi_client: 加 openpi-client src 到 PYTHONPATH + 自愈 websockets/msgpack ----
  export PYTHONPATH="$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  "$ROBOTWIN_PYTHON" -c "import openpi_client.websocket_client_policy" 2>/dev/null \
    || { echo "[selfheal] wrapper 装 websockets/msgpack"; "$ROBOTWIN_PYTHON" -m pip install -q websockets msgpack 2>&1 | tail -2 || true; }
  "$ROBOTWIN_PYTHON" -c "import openpi_client.websocket_client_policy" 2>/dev/null \
    || { echo "FATAL: wrapper 仍无法 import openpi_client (缺 websockets/msgpack?)" >&2; exit 13; }

  export ROBOTWIN_TASKS="beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three"
  for t in $ROBOTWIN_TASKS; do
    [ -f "$ROBOTWIN_PATH/envs/$t.py" ] || { echo "FATAL: 缺任务 $t" >&2; exit 13; }
  done
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM=50            # 6×50×4 = 1200 局
  export ROBOTWIN_NUM_SLOTS=1            # 每路 1 卡 1 slot
  export NUM_WORKERS=1                   # 每路 1 worker (1 卡 1 server)
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=8         # pi05 action_horizon=8: 执行整段 chunk 后 requery
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST="9.0"

  nvidia-smi -L | head -8
  echo "[$(date)] preflight OK; tasks=$ROBOTWIN_TASKS"

  NREP=4
  pids=""
  for i in $(seq 0 $((NREP-1))); do
    (
      export CUDA_VISIBLE_DEVICES=$i
      export SEED=$i
      export PORT_BASE=$((6700 + i*40))   # 每路独立端口段, 防 client/server 串台
      export ROBOTWIN_EVAL_ROOT=$REPO/lmvla/lawam/results/eval_runs/robotwin/pi05_rt_a1/seed$i
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      echo "[a1 seed$i] GPU=$i 启动 $(date -u)"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh "$CKPT" "$TASK_CONFIG" "seed$i"
      echo "[a1 seed$i] 结束 rc=$? $(date -u)"
    ) > "$LOG_DIR/pi05_rteval_a0_x4_${STAMP}_seed${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 25
  done
  echo "[$(date)] 已起 $NREP 路(a1×4seed): $pids"
  for p in $pids; do wait $p; done
  echo "[$(date)] 全部结束"

  # ---- 汇总 6 任务 × 4 seed SR ----
  $PYTHON - <<'PYEOF'
  import json, glob, os, statistics as st
  base = f"{os.environ['REPO']}/lmvla/lawam/results/eval_runs/robotwin/pi05_rt_a1"
  out = {}
  for f in sorted(glob.glob(f"{base}/seed*/**/*.json", recursive=True)):
      try: d = json.load(open(f))
      except Exception: continue
      if not isinstance(d, dict) or "success_rate" not in d: continue
      sd = f.split("/seed")[1].split("/")[0]
      out.setdefault(sd, {})[d.get("task_name","?")] = float(d["success_rate"])
  print("\n===== pi05_robotwin_a0 积木6任务 · 4变seed =====")
  if not out:
      print("⚠️ 未解析到 summary.json — 人工看 results/eval_runs/robotwin/pi05_rt_a1/")
  tasks = sorted({t for v in out.values() for t in v})
  for sd in sorted(out):
      print(f"  seed{sd}: " + " ".join(f"{t}={out[sd].get(t,float('nan')):.2f}" for t in tasks))
  for t in tasks:
      vs = [out[s][t] for s in out if t in out[s]]
      if vs: print(f"    {t:24s} 均值={st.mean(vs):6.3f} n={len(vs)}")
  allv = [out[s][t] for s in out for t in out[s]]
  if allv: print(f"  聚合SR={st.mean(allv):.3f} (n={len(allv)})")
  print("================================================\n")
  PYEOF

  echo "=== pi05_robotwin_a0 openpi eval DONE $(date -u) ==="

RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 0

AccessType: "Public"
