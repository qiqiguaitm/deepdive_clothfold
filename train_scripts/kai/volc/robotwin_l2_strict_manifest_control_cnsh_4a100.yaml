TaskName: "robotwin-l2-strict-manifest-control-cnsh4g"
Description: "Strict fixed-scene L2 control, six tasks x four eval seeds"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.14xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: L2_STRICT_METHOD
    Value: "combo"
  - Name: L2_STRICT_CONTROL
    Value: "zero"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/l2_strict_${L2_STRICT_METHOD}_${L2_STRICT_CONTROL}_${STAMP}.log" 2>&1
  set -x

  bash "$REPO/lmvla/lmwam/env/heal_lawam_symlinks.sh"
  source "$REPO/lmvla/lmwam/env/prepare_robotwin_renderer.sh"
  "$REPO/lmvla/lmwam/scripts/robotwin_python_wrapper.sh" -c \
    'import sapien.core as sapien; sapien.SapienRenderer(); print("SAPIEN_RENDER_OK")'
  nvidia-smi -L
  env SEEDS="0 1 2 3" GPUS_PER_SEED=1 LOCAL_GPU_COUNT=4 NUM_WORKERS=1 ROBOTWIN_NUM_SLOTS=1 \
    bash "$REPO/train_scripts/kai/eval/local_robotwin_l2_strict_manifest_control.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
