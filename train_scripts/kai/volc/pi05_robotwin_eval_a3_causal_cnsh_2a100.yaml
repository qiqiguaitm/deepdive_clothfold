TaskName: "pi05-a3-causal-cnsh2g"
Description: "pi0.5 A3 causal control, four seeds in two 2-A100 batches"
Tags: []

ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/kai:kai0-gf0"
ResourceQueueName: "robot-task"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni2.7xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -euo pipefail
  REPO=/vePFS/tim/workspace/deepdive_kai0
  mkdir -p /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  test -f "$REPO/train_scripts/kai/eval/local_robotwin_a3_official_2gpu.sh"
  test -d "$REPO/kai0/checkpoints/pi05_robotwin_a3_live_residual_prefix_official_east/pi05_robotwin_a3_live_residual_prefix_official/19999/params"
  exec env \
    ROBOTWIN_TASKS="${ROBOTWIN_TASKS:-beat_block_hammer blocks_ranking_rgb stack_blocks_two}" \
    ROBOTWIN_TEST_NUM="${ROBOTWIN_TEST_NUM:-50}" \
    LMWM_LIVE_HINT_INTERVENTION="${LMWM_LIVE_HINT_INTERVENTION:-current}" \
    RESULT_NAME="${ROBOTWIN_EVAL_RESULT_NAME:-pi05_rt_a3_current_hint_causal}" \
    SEEDS="0 1 2 3" \
    GPUS_PER_SEED=1 \
    LOCAL_GPU_COUNT=2 \
    MAX_PARALLEL_SEEDS=2 \
    SEED_STAGGER_SECONDS=20 \
    bash "$REPO/train_scripts/kai/eval/local_robotwin_a3_official_2gpu.sh"

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
