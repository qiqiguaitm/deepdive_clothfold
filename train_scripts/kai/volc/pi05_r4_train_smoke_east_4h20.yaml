TaskName: "pi05-r4-train-smoke-east4g"
Description: "Two-step exact-runtime smoke for matched R4 pi0.5 training"
Tags: []
ImageUrl: "visincept-cn-shanghai.cr.volces.com/grasp/h2r:1.0"
ResourceQueueName: "Robot-East-H20"
Framework: "PyTorch"
Preemptible: false
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"
ActiveDeadlineSeconds: 7200
EnableTensorBoard: false
Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnsh075262e1f815"
    MountPath: "/vePFS"
    SubPath: ""
CacheType: "Cloudfs"
Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
Entrypoint: |
  export REPO=/vePFS/tim/workspace/deepdive_kai0
  export R4_ARM=ordinary WORLD_SIZE=4 R4_STEPS=2 R4_SMOKE=1
  exec bash "$REPO/train_scripts/kai/run_pi05_r4_training.sh"
RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0
AccessType: "Public"
