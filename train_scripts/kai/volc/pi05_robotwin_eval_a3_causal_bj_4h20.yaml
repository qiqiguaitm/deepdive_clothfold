TaskName: "pi05-a3-current-hint-causal-bj4g"
Description: "pi0.5 A3 live-residual causal eval on four Beijing H20 GPUs"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 86400
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"
  - Name: OPENPI_DATA_HOME
    Value: "/vePFS-North-E/vis_robot/tim/openpi_cache"
  - Name: ROBOTWIN_EVAL_CONFIG
    Value: "pi05_robotwin_a3_live_residual_prefix_official_eval"
  - Name: ROBOTWIN_EVAL_CKPT_ROOT
    Value: "/vePFS-North-E/vis_robot/workspace/deepdive_kai0/kai0/checkpoints/pi05_robotwin_a3_live_residual_prefix_official_east/pi05_robotwin_a3_live_residual_prefix_official"
  - Name: ROBOTWIN_EVAL_RESULT_NAME
    Value: "pi05_rt_a3_current_hint_causal"
  - Name: ROBOTWIN_EVAL_PORT_BASE
    Value: "8300"
  - Name: ROBOTWIN_EVAL_NUM_SEEDS
    Value: "4"

Entrypoint: |
  set -euo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_rteval
  mkdir -p "$LOG_DIR"
  exec >> "$LOG_DIR/${ROBOTWIN_EVAL_RESULT_NAME}_${STAMP}.log" 2>&1
  set -x

  mkdir -p /home/tim/workspace
  ln -sfn "$REPO" /home/tim/workspace/deepdive_kai0
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export STAR_VLA_PYTHON=$PYTHON
  cd "$REPO/lmvla/lawam"

  export ROBOTWIN_SERVER_BACKEND=openpi
  export ROBOTWIN_OPENPI_CONFIG=$ROBOTWIN_EVAL_CONFIG
  export OPENPI_SERVE_SCRIPT=$REPO/kai0/scripts/serve_policy.py
  export KAI0_ROOT=$REPO/kai0
  export ROBOTWIN_MODEL_INTERFACE=openpi

  CKPT=$(find "$ROBOTWIN_EVAL_CKPT_ROOT" -maxdepth 1 -type d -regex '.*/[0-9]+' | sort -V | tail -1)
  [ -n "$CKPT" ] || { echo "FATAL: no checkpoint under $ROBOTWIN_EVAL_CKPT_ROOT" >&2; exit 13; }
  [ -d "$CKPT/params" ] || { echo "FATAL: checkpoint missing params/: $CKPT" >&2; exit 13; }
  [ -f "$CKPT/assets/robotwin2.0/norm_stats.json" ] || {
    echo "FATAL: checkpoint missing norm stats: $CKPT" >&2
    exit 13
  }

  export ROBOTWIN_PATH=/vePFS-North-E/vis_robot/huanqian/RoboTwin
  export ROBOTWIN_PYTHON=$REPO/lmvla/lawam/robotwin_python_wrapper_northe.sh
  [ -d "$ROBOTWIN_PATH/envs" ] || { echo "FATAL: RoboTwin missing" >&2; exit 13; }
  "$ROBOTWIN_PYTHON" -c "import sapien, mplib" 2>/dev/null
  export PYTHONPATH="$REPO/kai0/packages/openpi-client/src:${PYTHONPATH:-}"
  "$ROBOTWIN_PYTHON" -c "import openpi_client.websocket_client_policy" 2>/dev/null ||
    "$ROBOTWIN_PYTHON" -m pip install -q websockets msgpack

  export ROBOTWIN_TASKS="${ROBOTWIN_TASKS:-beat_block_hammer blocks_ranking_size blocks_ranking_rgb handover_block stack_blocks_two stack_blocks_three}"
  export TASK_CONFIG=demo_clean
  export ROBOTWIN_TEST_NUM="${ROBOTWIN_TEST_NUM:-50}"
  export ROBOTWIN_NUM_SLOTS="${ROBOTWIN_NUM_SLOTS:-1}"
  export NUM_WORKERS=1
  export PORT_SEARCH_LIMIT=30
  export ROBOTWIN_SAVE_VIDEO=0
  export ROBOTWIN_INSTRUCTION_TYPE=unseen
  export ROBOTWIN_SKIP_GET_OBS_WITHIN_REPLAN=1
  export ROBOTWIN_REPLAN_STEPS=50
  export ROBOTWIN_ACTION_ENSEMBLE=0
  export TORCH_CUDA_ARCH_LIST="9.0"

  pids=""
  for i in $(seq 0 $((ROBOTWIN_EVAL_NUM_SEEDS - 1))); do
    (
      export CUDA_VISIBLE_DEVICES=$i
      export SEED=$i
      export PORT_BASE=$((ROBOTWIN_EVAL_PORT_BASE + i*40))
      export ROBOTWIN_EVAL_ROOT=$REPO/lmvla/lawam/results/eval_runs/robotwin/$ROBOTWIN_EVAL_RESULT_NAME/seed$i
      mkdir -p "$ROBOTWIN_EVAL_ROOT"
      bash examples/Robotwin/eval_files/auto_eval_scripts/auto_eval_robotwin.sh \
        "$CKPT" "$TASK_CONFIG" "unseen-a3-seed$i"
    ) > "$LOG_DIR/${ROBOTWIN_EVAL_RESULT_NAME}_${STAMP}_seed${i}.log" 2>&1 &
    pids="$pids $!"
    sleep 25
  done
  for pid in $pids; do wait "$pid"; done
  echo "=== $ROBOTWIN_EVAL_RESULT_NAME DONE $(date -u) ==="

RetryOptions:
  EnableRetry: false
  MaxRetryTimes: 0

AccessType: "Public"
