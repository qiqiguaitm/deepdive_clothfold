# Parameterized RoboTwin pi0.5 baseline launcher. Defaults preserve the legacy
# 20k delta/quantile run; PI05_CONFIG_NAME and PI05_ABSOLUTE_ACTIONS select the
# corrected 50k absolute/mean-std recipe without mutating old checkpoints.

TaskName: "pi05-robotwin-a0-official-bj"
Description: "parameterized RoboTwin pi05 A0 training launcher"
Tags: []

ImageUrl: "dvs-cr-cn-beijing.cr.volces.com/vis_robot/kai:kai0-gf1"
ResourceQueueName: "Robot-North-H20"
Framework: "PyTorch"
Preemptible: false

TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 1
    Flavor: "ml.pni3ln.17xlarge"

ActiveDeadlineSeconds: 345600
EnableTensorBoard: false

Storages:
  - Type: "Vepfs"
    VepfsId: "vepfs-cnbj875793a96d6b"
    SubPath: "/vis_robot"
    MountPath: "/vePFS-North-E/vis_robot"

CacheType: "Cloudfs"

Envs:
  - Name: PYTHONUNBUFFERED
    Value: "1"
  - Name: HF_HUB_OFFLINE
    Value: "1"
  - Name: TRANSFORMERS_OFFLINE
    Value: "1"
  - Name: TOKENIZERS_PARALLELISM
    Value: "false"

Entrypoint: |
  set -uo pipefail
  export REPO=/vePFS-North-E/vis_robot/workspace/deepdive_kai0
  EXP="${PI05_EXP_NAME:-pi05_robotwin_a0_official}"
  TRAIN_SEED="${PI05_TRAIN_SEED:-42}"
  STAMP=$(date -u +%Y%m%d_%H%M%S)
  LOG_DIR=$REPO/lmvla/lawam/logs/volc_robotwin
  mkdir -p "$LOG_DIR"
  LOG="$LOG_DIR/${EXP}_${STAMP}.log"
  exec >> "$LOG" 2>&1
  set -x
  echo "=== pi05_robotwin_a0_official_bj start $(date -u) ==="

  cd $REPO/kai0
  export PYTHON=$REPO/kai0/.venv/bin/python
  export PATH=$REPO/kai0/.venv/bin:$PATH
  export XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
  export XLA_PYTHON_CLIENT_PREALLOCATE=false
  export HF_HOME=$REPO/datasets/.hf_cache
  export HF_DATASETS_CACHE=$HF_HOME/datasets
  export JAX_COMPILATION_CACHE_DIR=$REPO/.cache/jax
  mkdir -p "$HF_DATASETS_CACHE" "$JAX_COMPILATION_CACHE_DIR"

  INIT=/vePFS-North-E/vis_robot/base_init_ckpts/extracted/pi05_base/params
  CONFIG="${PI05_CONFIG_NAME:-pi05_robotwin_a0_official_bj}"
  DATA=/vePFS-North-E/vis_robot/huanqian/uniVP/data/robotwin2.0/robotwin2.0
  if [ "$CONFIG" = "pi05_robotwin_a0_public_exact_bj" ]; then
    DATA=/vePFS-North-E/vis_robot/huanqian/uniVP/data/robotwin2.0/robotwin2.0_official_prompts_v21
  fi
  ASSET_ID="${PI05_ASSET_ID:-robotwin2.0}"
  NORM=$REPO/kai0/assets/$CONFIG/$ASSET_ID/norm_stats.json
  [ -d "$DATA/meta" ] || { echo "FATAL: dataset missing $DATA" >&2; exit 13; }
  if [ "$CONFIG" = "pi05_robotwin_a0_public_exact_bj" ]; then
    REPAIR_MANIFEST=$DATA/meta/official_prompt_repair_manifest.json
    [ -f "$REPAIR_MANIFEST" ] || { echo "FATAL: repaired prompt manifest missing $REPAIR_MANIFEST" >&2; exit 14; }
  fi
  [ -f "$INIT/_METADATA" ] || { echo "FATAL: pi05_base init missing $INIT" >&2; exit 17; }

  if [ ! -f "$NORM" ]; then
    echo "[$(date)] computing official-aligned norm stats -> $NORM"
    ABSOLUTE_FLAG=""
    if [ "${PI05_ABSOLUTE_ACTIONS:-0}" = "1" ]; then
      ABSOLUTE_FLAG="--absolute-actions"
    fi
    python -u $REPO/train_scripts/kai/data/compute_robotwin_official_norm_fast.py \
      --repo "$DATA" \
      --out "$(dirname "$NORM")" \
      --action-dim 32 \
      --horizon 50 \
      $ABSOLUTE_FLAG
  fi
  [ -f "$NORM" ] || { echo "FATAL: norm stats still missing $NORM" >&2; exit 19; }
  echo "[$(date)] preflight OK (official config + norm + pi05_base init)"

  CKPT_DIR=$REPO/kai0/checkpoints/$CONFIG/$EXP
  if ls -d "$CKPT_DIR"/[0-9]*/ >/dev/null 2>&1; then
    RESUME_FLAG="--resume"
    echo "[resume] found ckpt -> --resume"
  else
    RESUME_FLAG="--overwrite"
    echo "[resume] fresh --overwrite"
  fi

  exec python -u scripts/train.py "$CONFIG" \
    --exp-name "$EXP" \
    --seed "$TRAIN_SEED" \
    --num-workers 8 \
    --no-wandb-enabled \
    $RESUME_FLAG

RetryOptions:
    EnableRetry: true
    MaxRetryTimes: 3

AccessType: "Public"
